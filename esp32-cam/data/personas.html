<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Personas Registradas</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0f14;--surface:#141720;--surface2:#1a1e2b;--border:#252a3a;--accent:#00e5a0;--accent2:#3d8ef8;--warn:#f59e0b;--danger:#ef4444;--text:#e2e8f0;--dim:#6b7a99;--r:4px}
body{font-family:'Courier New',Courier,monospace;background:var(--bg);color:var(--text);min-height:100vh;padding:12px}
.wrap{max-width:600px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:14px 0 10px;border-bottom:1px solid var(--border);margin-bottom:14px}
.back{background:none;border:1px solid var(--border);color:var(--dim);padding:5px 10px;border-radius:var(--r);font-family:inherit;font-size:11px;cursor:pointer;letter-spacing:1px}
.back:hover{color:var(--text);border-color:var(--dim)}
h1{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);flex:1;text-align:center}
.count{font-size:10px;color:var(--dim);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:2px 8px}
.top-btn{width:100%;padding:10px;border:none;border-radius:var(--r);font-family:inherit;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-bottom:12px;background:var(--accent);color:#0d0f14}
.top-btn:hover{background:#00c98e}
.panel{background:var(--surface);border:1px solid var(--accent2);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;display:none}
.panel.activo{display:block}
.panel-title{font-size:10px;color:var(--accent2);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.panel-text{font-size:11px;color:var(--dim)}
.spinner{display:inline-block;width:10px;height:10px;border:2px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:8px;transition:.15s}
.card:hover{border-color:var(--dim)}
.card-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px}
.card-info{font-size:10px;color:var(--dim);margin-bottom:8px;line-height:1.6}
.card-info span{color:var(--dim)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.act-btn{flex:1;min-width:80px;padding:7px 4px;border:1px solid var(--border);border-radius:var(--r);font-family:inherit;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;background:var(--surface2);color:var(--dim);transition:.15s}
.act-btn:hover{color:var(--text)}
.act-edit:hover{border-color:var(--warn);color:var(--warn)}
.act-huella:hover{border-color:var(--accent2);color:var(--accent2)}
.act-rostro:hover{border-color:var(--accent);color:var(--accent)}
.act-del:hover{border-color:var(--danger);color:var(--danger)}
.empty{text-align:center;padding:40px;color:var(--dim);font-size:12px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:var(--r);font-size:11px;display:none;z-index:100;letter-spacing:1px}
.toast.ok{border-color:var(--accent);color:var(--accent)}
.toast.err{border-color:var(--danger);color:var(--danger)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" onclick="window.location.href='/gestion'">← VOLVER</button>
    <h1>Personas Registradas</h1>
    <span class="count" id="cnt">0</span>
  </header>

  <button class="top-btn" onclick="window.location.href='/register'">+ REGISTRAR NUEVA PERSONA</button>

  <div id="panelProceso" class="panel">
    <div class="panel-title"><span class="spinner"></span><span id="panelTitulo">Procesando...</span></div>
    <div id="panelTexto" class="panel-text">Espere un momento.</div>
  </div>

  <div id="lista"><div class="empty">Cargando...</div></div>
</div>
<div id="toast" class="toast"></div>

<script>
let timerProceso=null,procesoActivo='';

function mostrarToast(msg,tipo=''){
  const el=document.getElementById('toast');
  el.className='toast'+(tipo?' '+tipo:'');
  el.textContent=msg;el.style.display='block';
  setTimeout(()=>{el.style.display='none';},2600);
}
function mostrarPanel(titulo,texto){
  document.getElementById('panelTitulo').textContent=titulo;
  document.getElementById('panelTexto').textContent=texto;
  document.getElementById('panelProceso').classList.add('activo');
}
function ocultarPanel(){document.getElementById('panelProceso').classList.remove('activo');}
function textoEstado(c){return c===1?'Coloque el dedo (1ra vez).':c===4?'Retire el dedo.':c===2?'Coloque el dedo (2da vez).':c===3?'Mire a la cámara.':'Procesando...';}
function detenerSeguimiento(){if(timerProceso){clearInterval(timerProceso);timerProceso=null;}procesoActivo='';ocultarPanel();}

function iniciarSeguimiento(tipo,nombre){
  detenerSeguimiento();procesoActivo=tipo;
  mostrarPanel('Actualizando '+tipo,'Preparando para '+nombre+'...');
  timerProceso=setInterval(async()=>{
    try{
      const e=await fetch('/estado').then(r=>r.json());
      if(procesoActivo==='huella'){
        if(e.codigo_paso===0){detenerSeguimiento();mostrarToast('Huella actualizada','ok');cargar();return;}
        mostrarPanel('Actualizando huella',textoEstado(e.codigo_paso));
      }else if(procesoActivo==='rostro'){
        if(e.codigo_paso===0){detenerSeguimiento();mostrarToast(e.rostro_ok?'Rostro actualizado':e.error_registro||'Error facial',e.rostro_ok?'ok':'err');cargar();return;}
        mostrarPanel('Actualizando rostro',textoEstado(e.codigo_paso));
      }
    }catch(err){mostrarPanel('Esperando...','Reintentando...');}
  },1500);
}

async function cargar(){
  try{
    const personas=await fetch('/api/personas').then(r=>r.json());
    document.getElementById('cnt').textContent=personas.length;
    window.cachePersonas=personas;
    const lista=document.getElementById('lista');
    if(personas.length===0){lista.innerHTML='<div class="empty">No hay personas registradas</div>';return;}
    lista.innerHTML=personas.map((p,idx)=>`
      <div class="card">
        <div class="card-name">${p.nombre}</div>
        <div class="card-info">RUT: ${p.rut||'N/A'} &nbsp;|&nbsp; EMAIL: ${p.email||'N/A'}<br>HUELLA ID: ${p.huella_id} &nbsp;|&nbsp; SYS ID: ${p.id}</div>
        <div class="actions">
          <button class="act-btn act-edit" onclick="editarPersona(${idx})">✎ Editar</button>
          <button class="act-btn act-huella" onclick="actualizarHuella(${idx})">☞ Huella</button>
          <button class="act-btn act-rostro" onclick="actualizarRostro(${idx})">◉ Rostro</button>
          <button class="act-btn act-del" onclick="borrarPersona('${p.id}')">✕ Borrar</button>
        </div>
      </div>`).join('');
  }catch(e){document.getElementById('lista').innerHTML='<div class="empty">Error cargando datos</div>';}
}
async function borrarPersona(id){
  if(!confirm('¿Borrar registro y huella del reloj?'))return;
  try{const r=await fetch('/borrar_persona?id='+encodeURIComponent(id));mostrarToast(await r.text(),r.ok?'ok':'err');cargar();}catch(e){mostrarToast('Error al borrar','err');}
}
async function editarPersona(idx){
  const p=window.cachePersonas[idx];if(!p)return;
  const nombre=(prompt('Nuevo nombre:',p.nombre||'')||'').trim();if(!nombre)return;
  const email=(prompt('Nuevo email:',p.email||'')||'').trim();
  try{const r=await fetch(`/editar_persona?id=${encodeURIComponent(p.id)}&name=${encodeURIComponent(nombre)}&email=${encodeURIComponent(email)}`);mostrarToast(await r.text(),r.ok?'ok':'err');cargar();}catch(e){mostrarToast('Error al editar','err');}
}
async function actualizarHuella(idx){
  const p=window.cachePersonas[idx];if(!p)return;
  if(!confirm('Actualizar huella de '+p.nombre+'?'))return;
  try{const r=await fetch('/actualizar_huella?id='+encodeURIComponent(p.id));const msg=await r.text();if(!r.ok){mostrarToast(msg,'err');return;}mostrarToast(msg,'ok');iniciarSeguimiento('huella',p.nombre);}catch(e){mostrarToast('Error','err');}
}
async function actualizarRostro(idx){
  const p=window.cachePersonas[idx];if(!p)return;
  if(!confirm('Actualizar rostro de '+p.nombre+'?'))return;
  try{const r=await fetch('/actualizar_rostro?id='+encodeURIComponent(p.id));const msg=await r.text();if(!r.ok){mostrarToast(msg,'err');return;}mostrarToast(msg,'ok');iniciarSeguimiento('rostro',p.nombre);}catch(e){mostrarToast('Error','err');}
}
cargar();setInterval(cargar,10000);
</script>
</body>
</html>
