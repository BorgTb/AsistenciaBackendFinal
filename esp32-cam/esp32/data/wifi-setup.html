<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SAS · Configuración de Red</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root{--bg:#0f172a;--surface:#1e293b;--surface-2:#334155;--border:#475569;--primary:#1d4ed8;--primary-light:#1e40af;--success:#16a34a;--warning:#d97706;--danger:#dc2626;--text:#f1f5f9;--muted:#94a3b8;--muted-2:#64748b;--line:rgba(255,255,255,.08);--radius:8px;--radius-lg:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
.wrap{max-width:440px;margin:0 auto;padding:16px 12px}

.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.back{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:.15s}
.back:hover{background:var(--surface-2)}
.top h1{font-size:15px;font-weight:700;flex:1;text-align:center;letter-spacing:-.3px}

.section-label{font-size:9px;color:var(--muted-2);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin:16px 0 8px;padding-left:10px;border-left:3px solid var(--primary)}

.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;font-weight:600}
.field input{width:100%;padding:10px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;font-size:13px;transition:.15s;outline:none}
.field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(29,78,216,.15)}

.btn{width:100%;padding:12px;border:none;border-radius:6px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px;transition:.15s;text-align:center}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-light)}
.btn-secondary{background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.btn-secondary:hover{color:var(--text);background:var(--surface-2)}

.msg{padding:10px 14px;border-radius:6px;font-size:12px;margin-top:8px;display:none;font-weight:500}
.msg.show{display:block}
.msg.ok{background:rgba(22,163,74,.1);border:1px solid var(--success);color:var(--success)}
.msg.err{background:rgba(220,38,38,.1);border:1px solid var(--danger);color:var(--danger)}

.warning-text{font-size:11px;color:var(--warning);margin-bottom:8px;padding:6px 10px;background:rgba(217,119,6,.08);border:1px solid rgba(217,119,6,.2);border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="back" onclick="location.href='/'">← Volver</button>
    <h1>Configuración de Red</h1>
  </div>

  <div class="section-label">Conexión Wi-Fi</div>
  <div class="form-card">
    <div class="field">
      <label>SSID (Nombre de red)</label>
      <input type="text" id="ssid" placeholder="Mi Red WiFi">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="password" placeholder="········">
    </div>
  </div>

  <div class="section-label">Servidores - Opcional (avanzado)</div>
  <div class="form-card">
    <div class="field">
      <label>Dirección del servidor (URL)</label>
      <input type="text" id="backend" placeholder="http://192.168.1.X:5000">
    </div>
    <div class="field">
      <label>Servidor MQTT (broker)</label>
      <input type="text" id="mqtt" placeholder="192.168.1.X">
    </div>
    <div class="field" style="display:flex;align-items:center;gap:10px;margin-top:12px">
      <label style="flex:1;margin:0;cursor:pointer" for="secure" onclick="document.getElementById('secure').checked=!document.getElementById('secure').checked;toggleSecureFields()">
        <span style="font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.6px;font-weight:600">Modo Seguro (TLS)</span>
      </label>
      <input type="checkbox" id="secure" onchange="toggleSecureFields()" style="width:20px;height:20px;accent-color:var(--primary);cursor:pointer">
    </div>
    <div id="secureFields" style="display:none">
      <div class="field">
        <label>Usuario MQTT</label>
        <input type="text" id="mqtt_user" placeholder="sas">
      </div>
      <div class="field">
        <label>Contraseña MQTT</label>
        <input type="password" id="mqtt_pass" placeholder="••••••••">
      </div>
      <div class="warning-text">⚠️ Al activar, el ESP32 usará TLS para conectar al broker y al backend.</div>
    </div>
  </div>

  <div class="section-label">PIN de registro</div>
  <div class="form-card">
    <div class="field">
      <label>Código de registro (opcional)</label>
      <input type="text" id="pin" placeholder="Código de 6 dígitos" maxlength="8" pattern="[A-Za-z0-9]*" style="font-size:22px;letter-spacing:6px;text-align:center;font-weight:600;font-family:'SF Mono',Monaco,monospace">
    </div>
  </div>

  <div class="section-label">Seguridad</div>
  <div class="form-card">
    <div class="field">
      <label>Contraseña de Administrador</label>
      <input type="password" id="adminPasswordNew" placeholder="Nueva contraseña (dejar vacío para no cambiar)">
    </div>
    <div class="field">
      <label>Contraseña Actual</label>
      <input type="password" id="adminPasswordOld" placeholder="Contraseña actual (requerido si ya existe)" style="display:none">
    </div>
    <div id="adminStatus" class="warning-text" style="display:none">⚠️ Ya hay una contraseña configurada</div>
  </div>

  <button class="btn btn-primary" onclick="guardar()">Guardar y Reiniciar</button>
  <button class="btn btn-secondary" onclick="reiniciarDispositivo()">Reiniciar dispositivo (sin guardar)</button>
  <button class="btn btn-secondary" onclick="location.href='/'">Cancelar</button>

  <div id="status" class="msg"></div>
</div>

<script>
fetch('/estado').then(r=>r.json()).then(data=>{
  if(data.ssid)document.getElementById('ssid').value=data.ssid;
  if(data.backend)document.getElementById('backend').value=data.backend;
  if(data.mqtt)document.getElementById('mqtt').value=data.mqtt;
  if(data.pin)document.getElementById('pin').value=data.pin;
  if(data.secure){
    document.getElementById('secure').checked=true;
    toggleSecureFields();
  }
  if(data.mqtt_user)document.getElementById('mqtt_user').value=data.mqtt_user;
  if(data.mqtt_pass)document.getElementById('mqtt_pass').value=data.mqtt_pass;
  if(data.admin_protegido){
    document.getElementById('adminPasswordOld').style.display='block';
    document.getElementById('adminStatus').style.display='block';
  }
});
function toggleSecureFields(){
  document.getElementById('secureFields').style.display=document.getElementById('secure').checked?'block':'none';
}
async function guardar(){
  const ssid=document.getElementById('ssid').value.trim();
  const pass=document.getElementById('password').value.trim();
  const backend=document.getElementById('backend').value.trim();
  const mqtt=document.getElementById('mqtt').value.trim();
  const pin=document.getElementById('pin').value.trim();
  const secure=document.getElementById('secure').checked;
  const mqtt_user=document.getElementById('mqtt_user').value.trim();
  const mqtt_pass=document.getElementById('mqtt_pass').value.trim();
  const adminOld=document.getElementById('adminPasswordOld').value.trim();
  const adminNew=document.getElementById('adminPasswordNew').value.trim();
  const el=document.getElementById('status');
  try{
    const params=new URLSearchParams();
    if(ssid)params.append('ssid',ssid);
    if(pass)params.append('pass',pass);
    if(backend)params.append('backend',backend);
    if(mqtt)params.append('mqtt',mqtt);
    if(pin)params.append('pin',pin);
    if(secure)params.append('secure','1');
    if(mqtt_user)params.append('mqtt_user',mqtt_user);
    if(mqtt_pass)params.append('mqtt_pass',mqtt_pass);
    if(adminNew)params.append('admin_password_new',adminNew);
    if(adminOld)params.append('admin_password_old',adminOld);
    const msg=await fetch('/wifi-config?'+params.toString()).then(r=>r.text());
    if(msg.includes('incorrecta')){
      el.className='msg show err';el.textContent=msg;
      return;
    }
    el.className='msg show ok';el.textContent=msg;
    setTimeout(()=>location.href='/',3000);
  }catch(e){
    el.className='msg show err';el.textContent='Error: '+e.message;
  }
}
async function reiniciarDispositivo(){
  if(!confirm('¿Reiniciar el dispositivo? Perderá los cambios no guardados.'))return;
  try{
    const r = await fetch('/reiniciar');
    if(r.ok){alert('Reiniciando dispositivo...');}
    else{alert('Error al reiniciar');}
  }catch(e){alert('Error: '+e.message);}
}
</script>
</body>
</html>
