<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Configuración de Red</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--s:#1e293b;--s2:#334155;--b:#475569;--a:#3b82f6;--g:#22c55e;--w:#f59e0b;--d:#ef4444;--t:#f1f5f9;--dim:#94a3b8;--r:8px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;font-size:14px}
.wrap{max-width:420px;margin:0 auto;padding:16px 12px}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.back{background:var(--s);border:1px solid var(--b);color:var(--t);padding:7px 14px;border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.back:hover{background:var(--s2)}
h1{font-size:15px;font-weight:600;flex:1;text-align:center}
h2{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:16px 0 6px;padding-left:10px;border-left:3px solid var(--a)}
label{display:block;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
input{width:100%;padding:10px 14px;background:var(--s);border:1px solid var(--b);border-radius:6px;color:var(--t);font-family:inherit;font-size:13px;margin-bottom:12px;transition:.15s}
input:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.btn{width:100%;padding:12px;border:none;border-radius:6px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px;transition:.15s}
.btn-go{background:var(--a);color:#fff}.btn-go:hover{background:#2563eb}
.btn-sec{background:var(--s);border:1px solid var(--b);color:var(--dim)}.btn-sec:hover{color:var(--t)}
.msg{padding:10px 14px;border-radius:6px;font-size:12px;margin-top:8px;display:none;font-weight:500}
.msg.show{display:block}
.msg.ok{background:rgba(34,197,94,.1);border:1px solid var(--g);color:var(--g)}
.msg.err{background:rgba(239,68,68,.1);border:1px solid var(--d);color:var(--d)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" onclick="location.href='/'">← Volver</button>
    <h1>Configuración de Red</h1>
  </header>

  <h2>Conexión Wi-Fi</h2>
  <label>SSID (Nombre de red)</label>
  <input type="text" id="ssid" placeholder="Mi Red WiFi">
  <label>Contraseña</label>
  <input type="password" id="password" placeholder="········">

  <h2>Servidores (Opcional)</h2>
  <label>URL Backend HTTP</label>
  <input type="text" id="backend" placeholder="http://192.168.1.X:5000">
  <label>IP Broker MQTT</label>
  <input type="text" id="mqtt" placeholder="192.168.1.X">

  <h2>PIN de Enrolamiento</h2>
  <label>Código de enrolamiento (opcional)</label>
  <input type="text" id="pin" placeholder="Código de 6 dígitos" maxlength="8" pattern="[A-Za-z0-9]*" style="font-size:22px;letter-spacing:6px;text-align:center;font-weight:600">

  <h2>Seguridad</h2>
  <label>Contraseña de Administrador</label>
  <input type="password" id="adminPasswordNew" placeholder="Nueva contraseña (dejar vacío para no cambiar)">
  <input type="password" id="adminPasswordOld" placeholder="Contraseña actual (requerido si ya existe)" style="display:none">
  <div id="adminStatus" style="font-size:11px;color:var(--w);margin-bottom:10px"></div>

  <button class="btn btn-go" onclick="guardar()">Guardar y Reiniciar</button>
  <button class="btn btn-sec" onclick="location.href='/'">Cancelar</button>

  <div id="status" class="msg"></div>
</div>

<script>
fetch('/estado').then(r=>r.json()).then(data=>{
  if(data.ssid)document.getElementById('ssid').value=data.ssid;
  if(data.backend)document.getElementById('backend').value=data.backend;
  if(data.mqtt)document.getElementById('mqtt').value=data.mqtt;
  if(data.admin_protegido){
    document.getElementById('adminPasswordOld').style.display='block';
    document.getElementById('adminStatus').textContent='\u26a0\uFE0F Ya hay una contrase\u00f1a configurada';
  }
});

async function guardar(){
  const ssid=document.getElementById('ssid').value.trim();
  const pass=document.getElementById('password').value.trim();
  const backend=document.getElementById('backend').value.trim();
  const mqtt=document.getElementById('mqtt').value.trim();
  const pin=document.getElementById('pin').value.trim();
  const adminOld=document.getElementById('adminPasswordOld').value.trim();
  const adminNew=document.getElementById('adminPasswordNew').value.trim();
  const el=document.getElementById('status');
  try{
    const params=new URLSearchParams();
    if(ssid)params.append('ssid',ssid);
    if(pass)params.append('pass',pass);
    if(backend)params.append('backend',backend);
    if(mqtt)params.append('mqtt',mqtt);
    if(pin)params.append('pin',pin);
    if(adminNew)params.append('admin_password_new',adminNew);
    if(adminOld)params.append('admin_password_old',adminOld);
    const msg=await fetch('/wifi-config?'+params.toString()).then(r=>r.text());
    if(msg.includes('incorrecta')){
      el.className='msg show err';el.textContent=msg;
      return;
    }
    el.className='msg show ok';el.textContent=msg;
    setTimeout(()=>location.href='/',3000);
  }catch(e){
    el.className='msg show err';el.textContent='Error: '+e.message;
  }
}
</script>
</body>
</html>
