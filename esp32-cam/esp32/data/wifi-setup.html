<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Configuración de Red</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0f14;--surface:#141720;--surface2:#1a1e2b;--border:#252a3a;--accent:#00e5a0;--accent2:#3d8ef8;--warn:#f59e0b;--danger:#ef4444;--text:#e2e8f0;--dim:#6b7a99;--r:4px}
body{font-family:'Courier New',Courier,monospace;background:var(--bg);color:var(--text);min-height:100vh;padding:12px;display:flex;align-items:flex-start;justify-content:center}
.wrap{max-width:440px;width:100%}
header{display:flex;align-items:center;gap:8px;padding:14px 0 10px;border-bottom:1px solid var(--border);margin-bottom:16px}
.back{background:none;border:1px solid var(--border);color:var(--dim);padding:5px 10px;border-radius:var(--r);font-family:inherit;font-size:11px;cursor:pointer;letter-spacing:1px}
.back:hover{color:var(--text);border-color:var(--dim)}
h1{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);flex:1;text-align:center}
.section-head{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:14px 0 8px;padding-left:8px;border-left:2px solid var(--accent2)}
label{display:block;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
input{width:100%;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:inherit;font-size:13px;margin-bottom:12px;transition:.15s}
input:focus{outline:none;border-color:var(--accent);background:var(--surface2)}
.btn{width:100%;padding:12px;border:none;border-radius:var(--r);font-family:inherit;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-bottom:8px;transition:.15s}
.btn-go{background:var(--accent);color:#0d0f14}
.btn-go:hover{background:#00c98e}
.btn-sec{background:var(--surface);border:1px solid var(--border);color:var(--dim)}
.btn-sec:hover{color:var(--text);border-color:var(--dim)}
.msg{padding:10px 12px;border-radius:var(--r);font-size:11px;margin-top:8px;display:none}
.msg.show{display:block}
.msg.success{background:rgba(0,229,160,.1);border:1px solid var(--accent);color:var(--accent)}
.msg.error{background:rgba(239,68,68,.1);border:1px solid var(--danger);color:var(--danger)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" onclick="window.location.href='/'">← VOLVER</button>
    <h1>Configuración de Red</h1>
  </header>

  <div class="section-head">Conexión Wi-Fi</div>
  <label>SSID (Nombre de la Red)</label>
  <input type="text" id="ssid" placeholder="MiRedWiFi">
  <label>Contraseña</label>
  <input type="password" id="password" placeholder="••••••••">

  <div class="section-head">Servidores (Opcional)</div>
  <label>URL Backend HTTP</label>
  <input type="text" id="backend" placeholder="http://192.168.1.X:5000">
  <label>IP Broker MQTT</label>
  <input type="text" id="mqtt" placeholder="192.168.1.X">

  <div class="section-head">Enrolamiento del Dispositivo</div>
  <label>PIN de Enrolamiento (Opcional)</label>
  <input type="text" id="pin" placeholder="Código de 6 dígitos" maxlength="8" pattern="[A-Za-z0-9]*" style="font-size:1.8rem;letter-spacing:0.3em;text-align:center">

  <button class="btn btn-go" onclick="guardar()">▶ GUARDAR Y REINICIAR</button>
  <button class="btn btn-sec" onclick="window.location.href='/'">CANCELAR</button>

  <div id="status" class="msg"></div>
</div>

<script>
fetch('/estado').then(r=>r.json()).then(data=>{
  if(data.ssid)document.getElementById('ssid').value=data.ssid;
  if(data.backend)document.getElementById('backend').value=data.backend;
  if(data.mqtt)document.getElementById('mqtt').value=data.mqtt;
});

async function guardar(){
  const ssid=document.getElementById('ssid').value.trim();
  const pass=document.getElementById('password').value.trim();
  const backend=document.getElementById('backend').value.trim();
  const mqtt=document.getElementById('mqtt').value.trim();
  const pin=document.getElementById('pin').value.trim();
  const el=document.getElementById('status');
  try{
    const params=new URLSearchParams();
    if(ssid)params.append('ssid',ssid);
    if(pass)params.append('pass',pass);
    if(backend)params.append('backend',backend);
    if(mqtt)params.append('mqtt',mqtt);
    if(pin)params.append('pin',pin);
    const msg=await fetch('/wifi-config?'+params.toString()).then(r=>r.text());
    el.className='msg show success';el.textContent=msg;
    setTimeout(()=>location.href='/',3000);
  }catch(e){
    el.className='msg show error';el.textContent='Error: '+e.message;
  }
}
</script>
</body>
</html>
