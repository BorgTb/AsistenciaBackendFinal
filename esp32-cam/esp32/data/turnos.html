<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SAS · Turnos</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root{--bg:#0f172a;--surface:#1e293b;--surface-2:#334155;--border:#475569;--primary:#1d4ed8;--primary-light:#1e40af;--success:#16a34a;--warning:#d97706;--danger:#dc2626;--text:#f1f5f9;--muted:#94a3b8;--muted-2:#64748b;--line:rgba(255,255,255,.08);--radius:8px;--radius-lg:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:16px 12px}

.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:.15s}
.back:hover{background:var(--surface-2)}
.top h1{font-size:15px;font-weight:700;flex:1;text-align:center;letter-spacing:-.3px}

.section-label{font-size:9px;color:var(--muted-2);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin:14px 0 8px;padding-left:10px;border-left:3px solid var(--primary)}

.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.field{margin-bottom:10px}
.field label{display:block;font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;font-weight:600}
.field input,.field select{width:100%;padding:10px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;font-size:13px;transition:.15s;outline:none}
.field input:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(29,78,216,.15)}

.trow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0 10px}
.dia{padding:9px 0;border:1px solid var(--border);border-radius:4px;background:var(--surface-2);color:var(--muted);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;text-align:center;transition:.15s}
.dia:hover{border-color:var(--muted-2)}
.dia.on{background:var(--primary);color:#fff;border-color:var(--primary)}

.hint{font-size:10px;color:var(--muted-2);margin-bottom:10px}
.btn{width:100%;padding:11px;border:none;border-radius:6px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:6px;transition:.15s;text-align:center}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-light)}
.btn-secondary{background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.btn-secondary:hover{color:var(--text);background:var(--surface-2)}

.item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item-info{flex:1;min-width:0}
.item-name{font-size:12px;font-weight:600;color:var(--text)}
.item-meta{font-size:10px;color:var(--muted);margin-top:2px}
.item-actions{display:flex;gap:4px;flex-shrink:0}
.action-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:4px 8px;border-radius:4px;font-family:inherit;font-size:9px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s}
.action-btn:hover{border-color:var(--danger);color:var(--danger)}
.action-btn.edit:hover{border-color:var(--primary);color:var(--primary)}
.del-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 10px;border-radius:4px;font-family:inherit;font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s}
.del-btn:hover{border-color:var(--danger);color:var(--danger)}

.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;max-width:360px;width:90%;text-align:center}
.modal h2{color:var(--text);margin:0 0 16px;font-size:16px}
.modal .field{margin-bottom:12px;text-align:left}
.modal .field label{display:block;font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;font-weight:600}
.modal .field input,.modal .field select{width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);color:var(--text);font-family:inherit;font-size:13px;outline:none;box-sizing:border-box}
.modal .field select option{background:var(--surface)}
.modal .btn{width:100%;padding:10px;border:none;border-radius:6px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:6px;display:block;text-align:center}
.modal .btn-primary{background:var(--primary);color:#fff}
.modal .btn-secondary{background:var(--surface);border:1px solid var(--border);color:var(--muted)}

.empty{text-align:center;padding:30px;color:var(--muted-2);font-size:12px}
.status{font-size:11px;color:var(--muted);text-align:center;padding:6px;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="back" onclick="location.href='/gestion'">← Volver</button>
    <h1>Gestión de Turnos</h1>
  </div>

  <div class="section-label">Crear Nuevo Turno</div>
  <div class="form-card">
    <div class="field">
      <label>Nombre del Turno</label>
      <input type="text" id="turnoNombre" placeholder="Ej: Turno Mañana">
    </div>
    <div class="trow">
      <div class="field"><label>Inicio</label><input type="time" id="turnoInicio" value="08:00"></div>
      <div class="field"><label>Fin</label><input type="time" id="turnoFin" value="16:00"></div>
    </div>
    <label style="font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.6px;font-weight:600;display:block;margin-bottom:4px">Días de la Semana</label>
    <div class="dgrid" id="diasPicker">
      <button class="dia on" data-dia="L" onclick="toggleDia(this)">L</button>
      <button class="dia on" data-dia="M" onclick="toggleDia(this)">M</button>
      <button class="dia on" data-dia="X" onclick="toggleDia(this)">X</button>
      <button class="dia on" data-dia="J" onclick="toggleDia(this)">J</button>
      <button class="dia on" data-dia="V" onclick="toggleDia(this)">V</button>
      <button class="dia" data-dia="S" onclick="toggleDia(this)">S</button>
      <button class="dia" data-dia="D" onclick="toggleDia(this)">D</button>
    </div>
    <div class="hint" id="diasPreview">Días: L, M, X, J, V</div>
    <button class="btn btn-primary" onclick="crearTurno()">Crear Turno</button>
    <div class="status" id="status"></div>
  </div>

  <div class="section-label">Turnos Existentes</div>
  <div id="listaTurnos"><div class="empty">Cargando...</div></div>

  <button class="btn btn-secondary" onclick="location.href='/gestion'" style="margin-top:8px">← Volver</button>
</div>

<div class="overlay" id="editOverlay" style="display:none" onclick="this.style.display='none'">
  <div class="modal" onclick="event.stopPropagation()">
    <h2 id="editTitle">Editar turno</h2>
    <div class="field">
      <label>Nombre del Turno</label>
      <input type="text" id="editNombre" placeholder="Ej: Turno Mañana">
    </div>
    <div class="trow">
      <div class="field"><label>Inicio</label><input type="time" id="editInicio" value="08:00"></div>
      <div class="field"><label>Fin</label><input type="time" id="editFin" value="16:00"></div>
    </div>
    <label style="font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.6px;font-weight:600;display:block;margin-bottom:4px">Días</label>
    <div class="dgrid" id="editDiasPicker">
      <button class="dia on" data-dia="L" onclick="toggleEditDia(this)">L</button>
      <button class="dia on" data-dia="M" onclick="toggleEditDia(this)">M</button>
      <button class="dia on" data-dia="X" onclick="toggleEditDia(this)">X</button>
      <button class="dia on" data-dia="J" onclick="toggleEditDia(this)">J</button>
      <button class="dia on" data-dia="V" onclick="toggleEditDia(this)">V</button>
      <button class="dia" data-dia="S" onclick="toggleEditDia(this)">S</button>
      <button class="dia" data-dia="D" onclick="toggleEditDia(this)">D</button>
    </div>
    <div class="hint" id="editDiasPreview">Días: L, M, X, J, V</div>
    <button class="btn btn-primary" id="editGuardarBtn">Guardar cambios</button>
    <button class="btn btn-secondary" onclick="document.getElementById('editOverlay').style.display='none'">Cancelar</button>
  </div>
</div>

<script>
const ordenDias=['L','M','X','J','V','S','D'];
const editSelec=new Set(['L','M','X','J','V']);
const selec=new Set(['L','M','X','J','V']);
const ADMIN_PW_KEY='sas_admin_session';
let adminHabilitado=false;
async function mostrarModalPassword(errorMsg){
  return new Promise(resolve=>{
    const ov=document.createElement('div');
    ov.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;font-family:sans-serif';
    ov.innerHTML='<div style="background:#1e293b;padding:24px;border-radius:8px;max-width:320px;width:90%;text-align:center;border:1px solid #475569">'
      +'<h2 style="color:#f1f5f9;margin:0 0 16px;font-size:16px">&#x1F512; Contrase&ntilde;a requerida</h2>'
      +'<input type="password" id="apw" style="width:100%;padding:10px;border:1px solid #475569;border-radius:6px;background:#0f172a;color:#f1f5f9;font-size:14px;margin-bottom:12px;box-sizing:border-box" placeholder="Ingrese contrase&ntilde;a"'+(errorMsg?'':' autofocus')+'>'
      +(errorMsg?'<div style="color:#ef4444;font-size:12px;margin-bottom:8px">'+errorMsg+'</div>':'')
      +'<button id="apb" style="width:100%;padding:10px;background:#1d4ed8;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer">Ingresar</button>'
      +'<button id="apc" style="width:100%;padding:8px;background:transparent;color:#94a3b8;border:none;border-radius:6px;font-size:12px;cursor:pointer;margin-top:6px">Cancelar</button></div>';
    document.body.appendChild(ov);
    const inp=ov.querySelector('#apw'),btn=ov.querySelector('#apb'),can=ov.querySelector('#apc');
    inp.focus();
    btn.onclick=()=>{const v=inp.value.trim();if(v){document.body.removeChild(ov);resolve(v);}else inp.focus();};
    can.onclick=()=>{document.body.removeChild(ov);resolve(null);};
    inp.onkeydown=e=>{if(e.key==='Enter')btn.onclick();};
  });
}
async function verificarAcceso(){
  try{
    const e=await fetch('/estado').then(r=>r.json());
    adminHabilitado=e.admin_protegido||false;
    if(!adminHabilitado)return true;
    let pw=sessionStorage.getItem(ADMIN_PW_KEY);
    if(pw){
      const t=await fetch('/api/logs?admin_password='+encodeURIComponent(pw));
      if(t.ok)return true;
      sessionStorage.removeItem(ADMIN_PW_KEY);
    }
    pw=await mostrarModalPassword();
    while(pw){
      const t=await fetch('/api/logs?admin_password='+encodeURIComponent(pw));
      if(t.ok){sessionStorage.setItem(ADMIN_PW_KEY,pw);return true;}
      pw=await mostrarModalPassword('Contrase&ntilde;a incorrecta');
    }
    document.body.innerHTML='<div style="padding:2em;text-align:center;font-family:sans-serif"><h2>&#x1F512; Acceso denegado</h2><p>Se requiere contrase&ntilde;a de administrador para ver esta p&aacute;gina.</p></div>';
    return false;
  }catch(e){return true;}
}
async function fetchProtegido(url){
  if(!adminHabilitado)return fetch(url);
  let pw=sessionStorage.getItem(ADMIN_PW_KEY);
  if(!pw)return null;
  const sep=url.includes('?')?'&':'?';
  const r=await fetch(url+sep+'admin_password='+encodeURIComponent(pw));
  if(r.status===401){sessionStorage.removeItem(ADMIN_PW_KEY);alert('Contrase&ntilde;a incorrecta. Recargue la p&aacute;gina.');return null;}
  return r;
}
function renderDias(){
  const dias=ordenDias.filter(d=>selec.has(d));
  document.getElementById('diasPreview').textContent='Días: '+(dias.length?dias.join(', '):'(ninguno)');
  document.querySelectorAll('.dia').forEach(b=>b.classList.toggle('on',selec.has(b.dataset.dia)));
}
function toggleDia(b){const d=b.dataset.dia;selec.has(d)?selec.delete(d):selec.add(d);renderDias();}
async function cargarTurnos(){
  try{
    const turnos=await fetchProtegido('/api/turnos').then(r=>r.json());
    const lista=document.getElementById('listaTurnos');
    if(!turnos.length){lista.innerHTML='<div class="empty">No hay turnos creados</div>';return;}
    lista.innerHTML=turnos.map(t=>`
      <div class="item">
        <div class="item-info">
          <div class="item-name">${t.nombre}</div>
          <div class="item-meta">${t.inicio} – ${t.fin} &nbsp;|&nbsp; ${t.dias} &nbsp;|&nbsp; ID: ${t.id}</div>
        </div>
        <div class="item-actions">
          <button class="action-btn edit" onclick="editarTurno('${t.id}','${t.nombre.replace(/'/g,"\\'")}','${t.inicio}','${t.fin}','${t.dias}')">Editar</button>
          <button class="del-btn" onclick="borrarTurno('${t.id}')">Borrar</button>
        </div>
      </div>`).join('');
  }catch(e){document.getElementById('listaTurnos').innerHTML='<div class="empty">Error</div>';}
}
async function borrarTurno(id){
  if(!confirm('¿Borrar este turno?'))return;
  try{const r=await fetchProtegido('/borrar_turno?id='+encodeURIComponent(id));if(!r)return;alert(await r.text());cargarTurnos();}
  catch(e){alert('Error al borrar');}
}
function toggleEditDia(b){const d=b.dataset.dia;editSelec.has(d)?editSelec.delete(d):editSelec.add(d);renderEditDias();}
function renderEditDias(){
  const dias=ordenDias.filter(d=>editSelec.has(d));
  document.getElementById('editDiasPreview').textContent='Días: '+(dias.length?dias.join(', '):'(ninguno)');
  document.querySelectorAll('#editDiasPicker .dia').forEach(b=>b.classList.toggle('on',editSelec.has(b.dataset.dia)));
}
let editTurnoId='';
function editarTurno(id,nombre,inicio,fin,dias){
  editTurnoId=id;
  document.getElementById('editNombre').value=nombre;
  document.getElementById('editInicio').value=inicio;
  document.getElementById('editFin').value=fin;
  editSelec.clear();
  (dias||'').split('').forEach(d=>{if(ordenDias.includes(d))editSelec.add(d);});
  renderEditDias();
  document.getElementById('editOverlay').style.display='flex';
}
document.getElementById('editGuardarBtn').onclick=async function(){
  const nombre=document.getElementById('editNombre').value.trim();
  const inicio=document.getElementById('editInicio').value;
  const fin=document.getElementById('editFin').value;
  const dias=ordenDias.filter(d=>editSelec.has(d)).join(',');
  if(!nombre||!inicio||!fin){alert('Complete todos los campos');return;}
  if(!dias){alert('Seleccione al menos un día');return;}
  try{
    const r=await fetchProtegido('/editar_turno?id='+encodeURIComponent(editTurnoId)+
      '&nombre='+encodeURIComponent(nombre)+
      '&inicio='+encodeURIComponent(inicio)+
      '&fin='+encodeURIComponent(fin)+
      '&dias='+encodeURIComponent(dias));
    if(!r)return;
    const msg=await r.text();
    document.getElementById('editOverlay').style.display='none';
    alert(msg);
    cargarTurnos();
  }catch(e){alert('Error al editar');}
};
async function crearTurno(){
  const nombre=document.getElementById('turnoNombre').value;
  const inicio=document.getElementById('turnoInicio').value;
  const fin=document.getElementById('turnoFin').value;
  const dias=ordenDias.filter(d=>selec.has(d)).join(',');
  if(!nombre||!inicio||!fin){alert('Complete todos los campos');return;}
  if(!dias){alert('Seleccione al menos un día');return;}
  try{
    const r=await fetchProtegido(`/crear_turno?nombre=${encodeURIComponent(nombre)}&inicio=${inicio}&fin=${fin}&dias=${encodeURIComponent(dias)}`);
    if(!r)return;
    const msg=await r.text();
    document.getElementById('status').textContent=msg;
    if(msg.includes('creado')){document.getElementById('turnoNombre').value='';cargarTurnos();}
  }catch(e){document.getElementById('status').textContent='Error: '+e.message;}
}
(async function(){
  if(!await verificarAcceso())return;
  renderDias();cargarTurnos();setInterval(cargarTurnos,15000);
})();
</script>
</body>
</html>
