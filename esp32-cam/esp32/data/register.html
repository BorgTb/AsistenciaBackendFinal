<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SAS · Registro biométrico (huella/rostro)</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root{--bg:#0f172a;--surface:#1e293b;--surface-2:#334155;--border:#475569;--primary:#1d4ed8;--primary-light:#1e40af;--success:#16a34a;--warning:#d97706;--danger:#dc2626;--text:#f1f5f9;--muted:#94a3b8;--muted-2:#64748b;--line:rgba(255,255,255,.08);--radius:8px;--radius-lg:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:16px 12px}

.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.back{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:.15s}
.back:hover{background:var(--surface-2)}
.top h1{font-size:15px;font-weight:700;flex:1;text-align:center;letter-spacing:-.3px}

.field{margin-bottom:14px}
.field label{display:block;font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;font-weight:600}
.field input{width:100%;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;font-size:13px;transition:.15s;outline:none}
.field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(29,78,216,.15)}

.btn{width:100%;padding:12px;border:none;border-radius:6px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:6px;transition:.15s;text-align:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary-light)}
.btn-secondary{background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.btn-secondary:hover{color:var(--text);border-color:var(--muted-2)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#15803d}
.btn-capture{background:var(--success);color:#fff;font-size:15px;padding:14px;margin-top:12px}
.btn-capture:hover:not(:disabled){background:#15803d}

#bp{display:none}

.steps{display:flex;gap:8px;margin-bottom:16px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.step{flex:1;text-align:center;opacity:.2;transition:all .3s ease}
.step.on{opacity:1}
.step.ok{opacity:.5}
.step .n{width:30px;height:30px;line-height:28px;border-radius:50%;border:2px solid var(--border);margin:0 auto 6px;font-size:12px;font-weight:700;transition:all .3s}
.step.on .n{border-color:var(--primary);color:var(--primary)}
.step.ok .n{border-color:var(--success);background:var(--success);color:#fff}
.step .l{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted-2)}
.step.on .l{color:var(--text)}
.step.ok .l{color:var(--muted)}

.detail{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 14px;text-align:center;margin-bottom:12px}
.detail .icon{font-size:40px;margin-bottom:8px}
.detail .title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.detail .desc{font-size:12px;color:var(--muted)}
#camPreview{max-width:200px;border-radius:6px;margin:10px auto 0;border:2px solid var(--primary);display:none}

#facialControls{display:none;margin-bottom:12px}
.foto-progress{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;font-size:13px;font-weight:600}
.foto-count{color:var(--success)}
.foto-dots{display:flex;gap:6px;justify-content:center;margin:10px 0}
.foto-dot{width:12px;height:12px;border-radius:50%;background:var(--surface-2);border:2px solid var(--border);transition:all .3s ease}
.foto-dot.ok{background:var(--success);border-color:var(--success)}
.foto-dot.fail{background:var(--danger);border-color:var(--danger)}
.foto-error{color:var(--danger);font-size:12px;margin-top:6px;display:none}

.badge-warning{display:inline-block;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:600;color:var(--warning);background:rgba(217,119,6,.1);border:1px solid rgba(217,119,6,.2)}
.badge-success{display:inline-block;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:600;color:var(--success);background:rgba(22,163,74,.1);border:1px solid rgba(22,163,74,.2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="back" onclick="location.href='/'">← Volver</button>
    <h1>Registro biométrico (huella/rostro)</h1>
  </div>

  <div id="form-container">
    <div class="field">
      <label>Nombre Completo</label>
      <input type="text" id="personName" placeholder="Juan Pérez" required>
    </div>
    <div class="field">
      <label>RUT</label>
      <input type="text" id="personRut" placeholder="12.345.678-9" required>
    </div>
    <div class="field">
      <label>Email Corporativo</label>
      <input type="email" id="personEmail" placeholder="juan@empresa.com" required>
    </div>
    <label style="display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;font-size:12px;color:var(--muted);line-height:1.4">
      <input type="checkbox" id="consentCheck" required style="margin-top:2px">
      <span>Acepto la política de privacidad y el tratamiento de datos biométricos (huella y rostro) para el control de asistencia</span>
    </label>
    <button class="btn btn-primary" onclick="iniciarRegistro()">Iniciar registro biométrico</button>
    <button class="btn btn-secondary" onclick="location.href='/'">Cancelar</button>
  </div>

  <div id="bp">
    <div class="steps">
      <div class="step on" id="step1"><div class="n">1</div><div class="l">Huella 1</div></div>
      <div class="step" id="step2"><div class="n">2</div><div class="l">Huella 2</div></div>
      <div class="step" id="step3"><div class="n">3</div><div class="l">Rostro</div></div>
    </div>
    <div class="detail">
      <div class="icon" id="camIcon">&#9997;</div>
      <img id="camPreview" src="">
      <div class="title" id="step3-title">Coloque el dedo en el sensor</div>
      <div class="desc" id="step3-desc">Mantenga presionado firmemente sobre el lector</div>
    </div>

    <div id="facialControls">
      <div class="foto-dots">
        <div class="foto-dot" id="dot1"></div>
        <div class="foto-dot" id="dot2"></div>
        <div class="foto-dot" id="dot3"></div>
      </div>
      <div class="foto-progress">
        <span>Fotos: </span><span class="foto-count" id="fotosCount">0/3</span>
      </div>
      <div class="foto-error" id="fotoError"></div>
      <button class="btn btn-capture" id="btnCapturar" onclick="capturarFoto()">
        &#128247; Capturar foto
      </button>
    </div>

    <button class="btn btn-success" id="btn-finish" style="display:none" onclick="location.reload()">Registrar Otra Persona</button>
    <button class="btn btn-secondary" onclick="location.href='/'">Volver al Inicio</button>
  </div>
</div>

<script>
let checkInterval,previewInterval,stepActual=0,registroFinalizado=false,capturando=false;
const ADMIN_PW_KEY='sas_admin_session';
let adminHabilitado=false;
async function mostrarModalPassword(errorMsg){
  return new Promise(resolve=>{
    const ov=document.createElement('div');
    ov.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;font-family:sans-serif';
    ov.innerHTML='<div style="background:#1e293b;padding:24px;border-radius:8px;max-width:320px;width:90%;text-align:center;border:1px solid #475569">'
      +'<h2 style="color:#f1f5f9;margin:0 0 16px;font-size:16px">&#x1F512; Contrase&ntilde;a requerida</h2>'
      +'<input type="password" id="apw" style="width:100%;padding:10px;border:1px solid #475569;border-radius:6px;background:#0f172a;color:#f1f5f9;font-size:14px;margin-bottom:12px;box-sizing:border-box" placeholder="Ingrese contrase&ntilde;a"'+(errorMsg?'':' autofocus')+'>'
      +(errorMsg?'<div style="color:#ef4444;font-size:12px;margin-bottom:8px">'+errorMsg+'</div>':'')
      +'<button id="apb" style="width:100%;padding:10px;background:#1d4ed8;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer">Ingresar</button>'
      +'<button id="apc" style="width:100%;padding:8px;background:transparent;color:#94a3b8;border:none;border-radius:6px;font-size:12px;cursor:pointer;margin-top:6px">Cancelar</button></div>';
    document.body.appendChild(ov);
    const inp=ov.querySelector('#apw'),btn=ov.querySelector('#apb'),can=ov.querySelector('#apc');
    inp.focus();
    btn.onclick=()=>{const v=inp.value.trim();if(v){document.body.removeChild(ov);resolve(v);}else inp.focus();};
    can.onclick=()=>{document.body.removeChild(ov);resolve(null);};
    inp.onkeydown=e=>{if(e.key==='Enter')btn.onclick();};
  });
}
async function verificarAcceso(){
  try{
    const e=await fetch('/estado').then(r=>r.json());
    adminHabilitado=e.admin_protegido||false;
    if(!adminHabilitado)return true;
    let pw=sessionStorage.getItem(ADMIN_PW_KEY);
    if(pw){
      const t=await fetch('/api/logs?admin_password='+encodeURIComponent(pw));
      if(t.ok)return true;
      sessionStorage.removeItem(ADMIN_PW_KEY);
    }
    pw=await mostrarModalPassword();
    while(pw){
      const t=await fetch('/api/logs?admin_password='+encodeURIComponent(pw));
      if(t.ok){sessionStorage.setItem(ADMIN_PW_KEY,pw);return true;}
      pw=await mostrarModalPassword('Contrase&ntilde;a incorrecta');
    }
    document.body.innerHTML='<div style="padding:2em;text-align:center;font-family:sans-serif"><h2>&#x1F512; Acceso denegado</h2><p>Se requiere contrase&ntilde;a de administrador para ver esta p&aacute;gina.</p></div>';
    return false;
  }catch(e){return true;}
}
async function fetchProtegido(url){
  if(!adminHabilitado)return fetch(url);
  let pw=sessionStorage.getItem(ADMIN_PW_KEY);
  if(!pw)return null;
  const sep=url.includes('?')?'&':'?';
  const r=await fetch(url+sep+'admin_password='+encodeURIComponent(pw));
  if(r.status===401){sessionStorage.removeItem(ADMIN_PW_KEY);alert('Contrase&ntilde;a incorrecta. Recargue la p&aacute;gina.');return null;}
  return r;
}
async function iniciarRegistro(){
  const nombre=document.getElementById('personName').value.trim();
  const rut=document.getElementById('personRut').value.trim();
  const email=document.getElementById('personEmail').value.trim();
  const consent=document.getElementById('consentCheck').checked;
  if(!nombre||!rut||!email){alert('Complete todos los datos.');return;}
  if(!consent){alert('Debe aceptar la pol\u00edtica de privacidad.');return;}
  try{
    const r=await fetchProtegido('/registrar?name='+encodeURIComponent(nombre)+'&rut='+encodeURIComponent(rut)+'&email='+encodeURIComponent(email)+'&consent=1');
    if(!r)return;
    if(r.ok){
      document.getElementById('form-container').style.display='none';
      document.getElementById('bp').style.display='block';
      marcarPasoActivo(1);
      checkInterval=setInterval(monitorearHardware,800);
    }else{alert('Error: '+(await r.text()));}
  }catch(e){alert('Error conectando con el reloj.');}
}
async function monitorearHardware(){
  try{
    const data=await fetch('/estado').then(r=>r.json());
    if(registroFinalizado)return;
    if(data.error_registro&&data.error_registro.length>0&&data.codigo_paso===0&&!data.rostro_ok){
      clearInterval(checkInterval);if(previewInterval)clearInterval(previewInterval);
      alert('Error: '+data.error_registro);return;
    }
    if(stepActual===1&&(data.codigo_paso===4||data.codigo_paso===2))marcarPasoActivo(2);
    if(data.codigo_paso===3&&stepActual<3){
      marcarPasoActivo(3);
      document.getElementById('facialControls').style.display='block';
      if(!previewInterval)previewInterval=setInterval(obtenerVistaPrevia,2000);
    }
    if(data.codigo_paso===3){
      actualizarProgresoFotos(data.fotos_tomadas||0);
    }
    if(data.rostro_ok===true&&data.codigo_paso===0){
      registroFinalizado=true;
      document.getElementById('facialControls').style.display='none';
      marcarExito();
    }
  }catch(e){}
}
async function capturarFoto(){
  if(capturando||registroFinalizado)return;
  capturando=true;
  const btn=document.getElementById('btnCapturar');
  const errEl=document.getElementById('fotoError');
  btn.textContent='Capturando...';
  btn.disabled=true;
  errEl.style.display='none';
  try{
    const r=await fetchProtegido('/capturar_foto_registro');
    if(!r){capturando=false;btn.textContent='\uD83D\uDCF7 Capturar foto';btn.disabled=false;return;}
    const data=await r.json();
    if(data.ok){
      actualizarProgresoFotos(data.fotos_tomadas);
      btn.textContent='\uD83D\uDCF7 Capturar foto ('+data.fotos_tomadas+'/3)';
      if(data.completado){
        document.getElementById('facialControls').style.display='none';
        btn.style.display='none';
      }
    }else{
      errEl.textContent=data.error||'Error al capturar. Intente de nuevo.';
      errEl.style.display='block';
      btn.textContent='\uD83D\uDCF7 Reintentar foto';
    }
  }catch(e){
    errEl.textContent='Error de conexion. Intente de nuevo.';
    errEl.style.display='block';
  }
  capturando=false;
  btn.disabled=false;
}
function actualizarProgresoFotos(count){
  document.getElementById('fotosCount').textContent=count+'/3';
  const dots=[document.getElementById('dot1'),document.getElementById('dot2'),document.getElementById('dot3')];
  for(let i=0;i<3;i++){
    dots[i].className='foto-dot'+(i<count?' ok':'');
  }
}
async function obtenerVistaPrevia(){
  try{
    const data=await fetchProtegido('/ultimo_registro').then(r=>r.json());
    if(data.imagen_url&&data.imagen_url.startsWith('http')){
      const img=document.getElementById('camPreview');
      document.getElementById('camIcon').style.display='none';
      img.style.display='block';
      img.src=data.imagen_url+'?t='+Date.now();
    }
  }catch(e){}
}
function marcarPasoActivo(paso){
  stepActual=paso;
  ['step1','step2','step3'].forEach(id=>document.getElementById(id).className='step');
  const icons=['&#9997;','&#9997;','&#128247;'];
  const titles=['Coloque el dedo en el sensor','Levante y vuelva a colocarlo','Presione el boton para capturar cada foto'];
  const descs=['Mantenga presionado firmemente','Para confirmar la plantilla de huella','Se requieren 3 fotos con buena calidad de rostro'];
  document.getElementById('camIcon').innerHTML=icons[paso-1];
  document.getElementById('step3-title').textContent=titles[paso-1];
  document.getElementById('step3-desc').textContent=descs[paso-1];
  if(paso===1)document.getElementById('step1').className='step on';
  else if(paso===2){document.getElementById('step1').className='step ok';document.getElementById('step2').className='step on';}
  else if(paso===3){
    document.getElementById('step1').className='step ok';
    document.getElementById('step2').className='step ok';
    document.getElementById('step3').className='step on';
  }
}
function marcarExito(){
  clearInterval(checkInterval);if(previewInterval)clearInterval(previewInterval);
  ['step1','step2','step3'].forEach(id=>document.getElementById(id).className='step ok');
  const icon=document.getElementById('camIcon');
  icon.innerHTML='&#10003;';icon.style.display='block';icon.style.color='var(--success)';
  document.getElementById('camPreview').style.display='none';
  document.getElementById('step3-title').textContent='¡Registro Completo!';
  document.getElementById('step3-desc').textContent='Rostro y huellas sincronizados correctamente.';
  document.getElementById('btn-finish').style.display='block';
}
verificarAcceso();
</script>
</body>
</html>
