<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Registro de Trabajador</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--s:#1e293b;--s2:#334155;--b:#475569;--a:#3b82f6;--g:#22c55e;--w:#f59e0b;--d:#ef4444;--t:#f1f5f9;--dim:#94a3b8;--r:8px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;font-size:14px}
.wrap{max-width:440px;margin:0 auto;padding:16px 12px}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.back{background:var(--s);border:1px solid var(--b);color:var(--t);padding:7px 14px;border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.back:hover{background:var(--s2)}
h1{font-size:15px;font-weight:600;flex:1;text-align:center}
label{display:block;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
input{width:100%;padding:10px 14px;background:var(--s);border:1px solid var(--b);border-radius:6px;color:var(--t);font-family:inherit;font-size:13px;margin-bottom:12px;transition:.15s}
input:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.btn{width:100%;padding:12px;border:none;border-radius:6px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:6px;transition:.15s}
.btn-go{background:var(--a);color:#fff}.btn-go:hover{background:#2563eb}
.btn-sec{background:var(--s);border:1px solid var(--b);color:var(--dim)}.btn-sec:hover{color:var(--t)}
.btn-fin{background:var(--g);color:#fff}.btn-fin:hover{background:#16a34a}
#bp{display:none}
.steps{display:flex;gap:8px;margin-bottom:16px;padding:14px;background:var(--s);border:1px solid var(--b);border-radius:var(--r)}
.step{flex:1;text-align:center;opacity:.25;transition:.3s}
.step.on{opacity:1}
.step.ok{opacity:.6}
.step .n{width:28px;height:28px;border-radius:50%;border:2px solid var(--b);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:12px;font-weight:700;transition:.3s}
.step.on .n{border-color:var(--a);color:var(--a)}
.step.ok .n{border-color:var(--g);background:var(--g);color:#fff}
.step .l{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
.step.on .l{color:var(--t)}
.detail{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:20px 14px;text-align:center;margin-bottom:12px}
.detail .icon{font-size:36px;margin-bottom:8px;color:var(--a)}
.detail .title{font-size:14px;font-weight:600;color:var(--t);margin-bottom:4px}
.detail .desc{font-size:12px;color:var(--dim)}
#camPreview{max-width:200px;border-radius:6px;margin:10px auto 0;border:2px solid var(--a);display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" onclick="location.href='/'">← Volver</button>
    <h1>Registro de Trabajador</h1>
  </header>

  <div id="form-container">
    <label>Nombre Completo</label>
    <input type="text" id="personName" placeholder="Juan Pérez" required>
    <label>RUT</label>
    <input type="text" id="personRut" placeholder="12345678-9" required>
    <label>Email Corporativo</label>
    <input type="email" id="personEmail" placeholder="juan@empresa.com" required>
    <button class="btn btn-go" onclick="iniciarRegistro()">Iniciar Escaneo Biométrico</button>
    <button class="btn btn-sec" onclick="location.href='/'">Cancelar</button>
  </div>

  <div id="bp">
    <div class="steps">
      <div class="step on" id="step1"><div class="n">1</div><div class="l">Huella 1</div></div>
      <div class="step" id="step2"><div class="n">2</div><div class="l">Huella 2</div></div>
      <div class="step" id="step3"><div class="n">3</div><div class="l">Rostro</div></div>
    </div>
    <div class="detail">
      <div class="icon" id="camIcon">&#9997;</div>
      <img id="camPreview" src="">
      <div class="title" id="step3-title">Coloque el dedo en el sensor</div>
      <div class="desc" id="step3-desc">Mantenga presionado firmemente sobre el lector</div>
    </div>
    <button class="btn btn-fin" id="btn-finish" style="display:none" onclick="location.reload()">Registrar Otra Persona</button>
    <button class="btn btn-sec" onclick="location.href='/'">Volver al Inicio</button>
  </div>
</div>

<script>
let checkInterval,previewInterval,stepActual=0,registroFinalizado=false;
const ADMIN_PW_KEY='sas_admin_session';
let adminHabilitado=false;
async function mostrarModalPassword(errorMsg){
  return new Promise(resolve=>{
    const ov=document.createElement('div');
    ov.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;font-family:sans-serif';
    ov.innerHTML='<div style="background:#1e293b;padding:24px;border-radius:8px;max-width:320px;width:90%;text-align:center;border:1px solid #475569">'
      +'<h2 style="color:#f1f5f9;margin:0 0 16px;font-size:16px">&#x1F512; Contrase&ntilde;a requerida</h2>'
      +'<input type="password" id="apw" style="width:100%;padding:10px;border:1px solid #475569;border-radius:6px;background:#0f172a;color:#f1f5f9;font-size:14px;margin-bottom:12px;box-sizing:border-box" placeholder="Ingrese contrase&ntilde;a"'+(errorMsg?'':' autofocus')+'>'
      +(errorMsg?'<div style="color:#ef4444;font-size:12px;margin-bottom:8px">'+errorMsg+'</div>':'')
      +'<button id="apb" style="width:100%;padding:10px;background:#3b82f6;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer">Ingresar</button>'
      +'<button id="apc" style="width:100%;padding:8px;background:transparent;color:#94a3b8;border:none;border-radius:6px;font-size:12px;cursor:pointer;margin-top:6px">Cancelar</button></div>';
    document.body.appendChild(ov);
    const inp=ov.querySelector('#apw'),btn=ov.querySelector('#apb'),can=ov.querySelector('#apc');
    inp.focus();
    btn.onclick=()=>{const v=inp.value.trim();if(v){document.body.removeChild(ov);resolve(v);}else inp.focus();};
    can.onclick=()=>{document.body.removeChild(ov);resolve(null);};
    inp.onkeydown=e=>{if(e.key==='Enter')btn.onclick();};
  });
}

async function verificarAcceso(){
  try{
    const e=await fetch('/estado').then(r=>r.json());
    adminHabilitado=e.admin_protegido||false;
    if(!adminHabilitado)return true;
    let pw=sessionStorage.getItem(ADMIN_PW_KEY);
    if(pw){
      const t=await fetch('/api/logs?admin_password='+encodeURIComponent(pw));
      if(t.ok)return true;
      sessionStorage.removeItem(ADMIN_PW_KEY);
    }
    pw=await mostrarModalPassword();
    while(pw){
      const t=await fetch('/api/logs?admin_password='+encodeURIComponent(pw));
      if(t.ok){sessionStorage.setItem(ADMIN_PW_KEY,pw);return true;}
      pw=await mostrarModalPassword('Contrase&ntilde;a incorrecta');
    }
    document.body.innerHTML='<div style="padding:2em;text-align:center;font-family:sans-serif"><h2>&#x1F512; Acceso denegado</h2><p>Se requiere contrase&ntilde;a de administrador para ver esta p&aacute;gina.</p></div>';
    return false;
  }catch(e){return true;}
}

async function fetchProtegido(url){
  if(!adminHabilitado)return fetch(url);
  let pw=sessionStorage.getItem(ADMIN_PW_KEY);
  if(!pw)return null;
  const sep=url.includes('?')?'&':'?';
  const r=await fetch(url+sep+'admin_password='+encodeURIComponent(pw));
  if(r.status===401){sessionStorage.removeItem(ADMIN_PW_KEY);alert('Contrase&ntilde;a incorrecta. Recargue la p&aacute;gina.');return null;}
  return r;
}

async function iniciarRegistro(){
  const nombre=document.getElementById('personName').value.trim();
  const rut=document.getElementById('personRut').value.trim();
  const email=document.getElementById('personEmail').value.trim();
  if(!nombre||!rut||!email){alert('Complete todos los datos.');return;}
  try{
    const r=await fetchProtegido('/registrar?name='+encodeURIComponent(nombre)+'&rut='+encodeURIComponent(rut)+'&email='+encodeURIComponent(email));
    if(!r)return;
    if(r.ok){
      document.getElementById('form-container').style.display='none';
      document.getElementById('bp').style.display='block';
      marcarPasoActivo(1);
      checkInterval=setInterval(monitorearHardware,800);
    }else{alert('Error: '+(await r.text()));}
  }catch(e){alert('Error conectando con el reloj.');}
}

async function monitorearHardware(){
  try{
    const data=await fetch('/estado').then(r=>r.json());
    if(registroFinalizado)return;
    if(data.error_registro&&data.error_registro.length>0){clearInterval(checkInterval);if(previewInterval)clearInterval(previewInterval);alert('Error: '+data.error_registro);return;}
    if(stepActual===1&&(data.codigo_paso===4||data.codigo_paso===2))marcarPasoActivo(2);
    if(data.codigo_paso===3&&stepActual<3){marcarPasoActivo(3);if(!previewInterval)previewInterval=setInterval(obtenerVistaPrevia,1500);}
    if(data.rostro_ok===true&&data.codigo_paso===0){registroFinalizado=true;marcarExito();}
  }catch(e){}
}

async function obtenerVistaPrevia(){
  try{
    const data=await fetchProtegido('/ultimo_registro').then(r=>r.json());
    if(data.imagen_url&&data.imagen_url.startsWith('http')){
      const img=document.getElementById('camPreview');
      document.getElementById('camIcon').style.display='none';
      img.style.display='block';
      img.src=data.imagen_url+'?t='+Date.now();
    }
  }catch(e){}
}

function marcarPasoActivo(paso){
  stepActual=paso;
  ['step1','step2','step3'].forEach(id=>document.getElementById(id).className='step');
  const icons=['&#9997;','&#9997;','&#128247;'];
  const titles=['Coloque el dedo en el sensor','Levante y vuelva a colocarlo','Mire a la cámara del reloj'];
  const descs=['Mantenga presionado firmemente','Para confirmar la plantilla biométrica','Se registrará su rostro en la base de datos'];
  document.getElementById('camIcon').innerHTML=icons[paso-1];
  document.getElementById('step3-title').textContent=titles[paso-1];
  document.getElementById('step3-desc').textContent=descs[paso-1];
  if(paso===1)document.getElementById('step1').className='step on';
  else if(paso===2){document.getElementById('step1').className='step ok';document.getElementById('step2').className='step on';}
  else if(paso===3){document.getElementById('step1').className='step ok';document.getElementById('step2').className='step ok';document.getElementById('step3').className='step on';}
}

function marcarExito(){
  clearInterval(checkInterval);if(previewInterval)clearInterval(previewInterval);
  ['step1','step2','step3'].forEach(id=>document.getElementById(id).className='step ok');
  const icon=document.getElementById('camIcon');
  icon.innerHTML='&#10003;';icon.style.display='block';icon.style.color='var(--g)';
  document.getElementById('camPreview').style.display='none';
  document.getElementById('step3-title').textContent='¡Registro Completo!';
  document.getElementById('step3-desc').textContent='Rostro y huellas sincronizados correctamente.';
  document.getElementById('btn-finish').style.display='block';
}
verificarAcceso();
</script>
</body>
</html>
