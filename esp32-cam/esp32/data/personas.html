<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SAS · Personas</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root{--bg:#0f172a;--surface:#1e293b;--surface-2:#334155;--border:#475569;--primary:#1d4ed8;--primary-light:#1e40af;--success:#16a34a;--warning:#d97706;--danger:#dc2626;--text:#f1f5f9;--muted:#94a3b8;--muted-2:#64748b;--line:rgba(255,255,255,.08);--radius:8px;--radius-lg:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:16px 12px}

.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:.15s}
.back:hover{background:var(--surface-2)}
.top h1{font-size:15px;font-weight:700;flex:1;text-align:center;letter-spacing:-.3px}
.badge{background:var(--primary);color:#fff;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}

.cta{width:100%;padding:12px;border:none;border-radius:6px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:16px;background:var(--success);color:#fff;transition:.15s;text-align:center}
.cta:hover{background:#15803d}

.panel{background:var(--surface);border:1px solid var(--primary);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;display:none}
.panel.on{display:block}
.panel .title{font-size:11px;font-weight:600;color:var(--primary);margin-bottom:4px}
.panel .text{font-size:12px;color:var(--muted)}

.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;transition:border-color .15s}
.card:hover{border-color:var(--muted-2)}
.card-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.card-info{font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.6}
.card-info span{color:var(--muted-2)}

.actions{display:flex;gap:6px;flex-wrap:wrap}
.abtn{flex:1;min-width:64px;padding:8px 6px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:10px;font-weight:600;cursor:pointer;background:var(--surface-2);color:var(--muted);transition:all .15s;text-transform:uppercase;letter-spacing:.4px;text-align:center}
.abtn:hover{color:var(--text)}
.a-ed:hover{border-color:var(--warning);color:var(--warning)}
.a-h:hover{border-color:var(--primary);color:var(--primary)}
.a-r:hover{border-color:var(--success);color:var(--success)}
.a-p:hover{border-color:var(--primary);color:var(--primary)}
.a-del:hover{border-color:var(--danger);color:var(--danger)}

.empty{text-align:center;padding:50px 20px;color:var(--muted-2);font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--success);color:var(--text);padding:10px 20px;border-radius:6px;font-size:12px;font-weight:500;display:none;z-index:100}
.toast.err{border-color:var(--danger)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="back" onclick="location.href='/gestion'">← Volver</button>
    <h1>Personas Registradas</h1>
    <span class="badge" id="cnt">0</span>
  </div>

  <button class="cta" onclick="location.href='/register'">+ Registrar Nueva Persona</button>

  <div id="panelProceso" class="panel">
    <div class="title"><span class="spin"></span><span id="panelTitulo">Procesando...</span></div>
    <div id="panelTexto" class="text">Espere un momento.</div>
  </div>

  <div id="lista"><div class="empty">Cargando...</div></div>
</div>
<div id="toast" class="toast"></div>

<script>
let timerProceso=null,procesoActivo='';
const ADMIN_PW_KEY='sas_admin_session';
let adminHabilitado=false;
async function mostrarModalPassword(errorMsg){
  return new Promise(resolve=>{
    const ov=document.createElement('div');
    ov.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;font-family:sans-serif';
    ov.innerHTML='<div style="background:#1e293b;padding:24px;border-radius:8px;max-width:320px;width:90%;text-align:center;border:1px solid #475569">'
      +'<h2 style="color:#f1f5f9;margin:0 0 16px;font-size:16px">&#x1F512; Contrase&ntilde;a requerida</h2>'
      +'<input type="password" id="apw" style="width:100%;padding:10px;border:1px solid #475569;border-radius:6px;background:#0f172a;color:#f1f5f9;font-size:14px;margin-bottom:12px;box-sizing:border-box" placeholder="Ingrese contrase&ntilde;a"'+(errorMsg?'':' autofocus')+'>'
      +(errorMsg?'<div style="color:#ef4444;font-size:12px;margin-bottom:8px">'+errorMsg+'</div>':'')
      +'<button id="apb" style="width:100%;padding:10px;background:#1d4ed8;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer">Ingresar</button>'
      +'<button id="apc" style="width:100%;padding:8px;background:transparent;color:#94a3b8;border:none;border-radius:6px;font-size:12px;cursor:pointer;margin-top:6px">Cancelar</button></div>';
    document.body.appendChild(ov);
    const inp=ov.querySelector('#apw'),btn=ov.querySelector('#apb'),can=ov.querySelector('#apc');
    inp.focus();
    btn.onclick=()=>{const v=inp.value.trim();if(v){document.body.removeChild(ov);resolve(v);}else inp.focus();};
    can.onclick=()=>{document.body.removeChild(ov);resolve(null);};
    inp.onkeydown=e=>{if(e.key==='Enter')btn.onclick();};
  });
}
async function verificarAcceso(){
  try{
    const e=await fetch('/estado').then(r=>r.json());
    adminHabilitado=e.admin_protegido||false;
    if(!adminHabilitado)return true;
    let pw=sessionStorage.getItem(ADMIN_PW_KEY);
    if(pw){
      const t=await fetch('/api/logs?admin_password='+encodeURIComponent(pw));
      if(t.ok)return true;
      sessionStorage.removeItem(ADMIN_PW_KEY);
    }
    pw=await mostrarModalPassword();
    while(pw){
      const t=await fetch('/api/logs?admin_password='+encodeURIComponent(pw));
      if(t.ok){sessionStorage.setItem(ADMIN_PW_KEY,pw);return true;}
      pw=await mostrarModalPassword('Contrase&ntilde;a incorrecta');
    }
    document.body.innerHTML='<div style="padding:2em;text-align:center;font-family:sans-serif"><h2>&#x1F512; Acceso denegado</h2><p>Se requiere contrase&ntilde;a de administrador para ver esta p&aacute;gina.</p></div>';
    return false;
  }catch(e){return true;}
}
async function fetchProtegido(url){
  if(!adminHabilitado)return fetch(url);
  let pw=sessionStorage.getItem(ADMIN_PW_KEY);
  if(!pw)return null;
  const sep=url.includes('?')?'&':'?';
  const r=await fetch(url+sep+'admin_password='+encodeURIComponent(pw));
  if(r.status===401){sessionStorage.removeItem(ADMIN_PW_KEY);alert('Contrase&ntilde;a incorrecta. Recargue la p&aacute;gina.');return null;}
  return r;
}
function mostrarToast(msg,tipo=''){
  const el=document.getElementById('toast');
  el.className='toast'+(tipo?' '+tipo:'');
  el.textContent=msg;el.style.display='block';
  setTimeout(()=>{el.style.display='none';},2600);
}
function mostrarPanel(titulo,texto){
  document.getElementById('panelTitulo').textContent=titulo;
  document.getElementById('panelTexto').textContent=texto;
  document.getElementById('panelProceso').classList.add('on');
}
function ocultarPanel(){document.getElementById('panelProceso').classList.remove('on');}
function textoEstado(c){return c===1?'Coloque el dedo (1ra vez).':c===4?'Retire el dedo.':c===2?'Coloque el dedo (2da vez).':c===3?'Mire a la cámara.':'Procesando...';}
function detenerSeguimiento(){if(timerProceso){clearInterval(timerProceso);timerProceso=null;}procesoActivo='';ocultarPanel();}
function iniciarSeguimiento(tipo,nombre){
  detenerSeguimiento();procesoActivo=tipo;
  mostrarPanel('Actualizando '+tipo,'Preparando para '+nombre+'...');
  timerProceso=setInterval(async()=>{
    try{
      const e=await fetch('/estado').then(r=>r.json());
      if(procesoActivo==='huella'){
        if(e.codigo_paso===0){detenerSeguimiento();mostrarToast('Huella actualizada','ok');cargar();return;}
        mostrarPanel('Actualizando huella',textoEstado(e.codigo_paso));
      }else if(procesoActivo==='rostro'){
        if(e.codigo_paso===0){detenerSeguimiento();mostrarToast(e.rostro_ok?'Rostro actualizado':e.error_registro||'Error facial',e.rostro_ok?'ok':'err');cargar();return;}
        mostrarPanel('Actualizando rostro',textoEstado(e.codigo_paso));
      }else if(procesoActivo==='fotos'){
        if(e.codigo_paso===0){detenerSeguimiento();mostrarToast(e.rostro_ok?'Fotos agregadas correctamente':e.error_registro||'Error facial',e.rostro_ok?'ok':'err');cargar();return;}
        mostrarPanel('Agregando fotos',textoEstado(e.codigo_paso));
      }
    }catch(err){mostrarPanel('Esperando...','Reintentando...');}
  },1500);
}
async function cargar(){
  try{
    const personas=await fetchProtegido('/api/personas').then(r=>r.json());
    document.getElementById('cnt').textContent=personas.length;
    window.cachePersonas=personas;
    const lista=document.getElementById('lista');
    if(personas.length===0){lista.innerHTML='<div class="empty">No hay personas registradas</div>';return;}
    lista.innerHTML=personas.map((p,idx)=>`
      <div class="card">
        <div class="card-name">${p.nombre}</div>
        <div class="card-info">RUT: ${p.rut||'N/A'} &nbsp;|&nbsp; Email: ${p.email||'N/A'}<br><span>ID Huella: ${p.huella_id} &nbsp;|&nbsp; ID Interno: ${p.id}</span></div>
        <div class="actions">
          <button class="abtn a-ed" onclick="editarPersona(${idx})">Editar</button>
          <button class="abtn a-h" onclick="actualizarHuella(${idx})">Huella</button>
          <button class="abtn a-r" onclick="actualizarRostro(${idx})">Rostro</button>
          <button class="abtn a-p" onclick="agregarFotos(${idx})">+Fotos</button>
          <button class="abtn a-del" onclick="borrarPersona('${p.id}')">Borrar</button>
        </div>
      </div>`).join('');
  }catch(e){document.getElementById('lista').innerHTML='<div class="empty">Error cargando datos</div>';}
}
async function borrarPersona(id){
  if(!confirm('¿Borrar registro y huella del reloj?'))return;
  try{const r=await fetchProtegido('/borrar_persona?id='+encodeURIComponent(id));if(!r)return;mostrarToast(await r.text(),r.ok?'ok':'err');cargar();}catch(e){mostrarToast('Error al borrar','err');}
}
async function editarPersona(idx){
  const p=window.cachePersonas[idx];if(!p)return;
  const nombre=(prompt('Nuevo nombre:',p.nombre||'')||'').trim();if(!nombre)return;
  const email=(prompt('Nuevo email:',p.email||'')||'').trim();
  try{const r=await fetchProtegido(`/editar_persona?id=${encodeURIComponent(p.id)}&name=${encodeURIComponent(nombre)}&email=${encodeURIComponent(email)}`);if(!r)return;mostrarToast(await r.text(),r.ok?'ok':'err');cargar();}catch(e){mostrarToast('Error al editar','err');}
}
async function actualizarHuella(idx){
  const p=window.cachePersonas[idx];if(!p)return;
  if(!confirm('Actualizar huella de '+p.nombre+'?'))return;
  try{const r=await fetchProtegido('/actualizar_huella?id='+encodeURIComponent(p.id));if(!r)return;const msg=await r.text();if(!r.ok){mostrarToast(msg,'err');return;}mostrarToast(msg,'ok');iniciarSeguimiento('huella',p.nombre);}catch(e){mostrarToast('Error','err');}
}
async function actualizarRostro(idx){
  const p=window.cachePersonas[idx];if(!p)return;
  if(!confirm('Actualizar rostro de '+p.nombre+'?'))return;
  try{const r=await fetchProtegido('/actualizar_rostro?id='+encodeURIComponent(p.id));if(!r)return;const msg=await r.text();if(!r.ok){mostrarToast(msg,'err');return;}mostrarToast(msg,'ok');iniciarSeguimiento('rostro',p.nombre);}catch(e){mostrarToast('Error','err');}
}
async function agregarFotos(idx){
  const p=window.cachePersonas[idx];if(!p)return;
  if(!confirm('Agregar fotos adicionales para '+p.nombre+'? Se tomaran varias capturas.'))return;
  try{const r=await fetchProtegido('/agregar_fotos?id='+encodeURIComponent(p.id));if(!r)return;const msg=await r.text();if(!r.ok){mostrarToast(msg,'err');return;}mostrarToast(msg,'ok');iniciarSeguimiento('fotos',p.nombre);}catch(e){mostrarToast('Error','err');}
}
(async function(){
  if(!await verificarAcceso())return;
  cargar();setInterval(cargar,10000);
})();
</script>
</body>
</html>
