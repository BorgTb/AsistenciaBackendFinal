<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Personas Registradas</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--s:#1e293b;--s2:#334155;--b:#475569;--a:#3b82f6;--g:#22c55e;--w:#f59e0b;--d:#ef4444;--t:#f1f5f9;--dim:#94a3b8;--r:8px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;font-size:14px}
.wrap{max-width:540px;margin:0 auto;padding:16px 12px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{background:var(--s);border:1px solid var(--b);color:var(--t);padding:7px 14px;border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.back:hover{background:var(--s2)}
h1{font-size:15px;font-weight:600;flex:1;text-align:center}
.badge{background:var(--a);color:#fff;font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;white-space:nowrap}
.cta{width:100%;padding:11px;border:none;border-radius:6px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:14px;background:var(--g);color:#fff;transition:.15s}
.cta:hover{background:#16a34a}
.panel{background:var(--s);border:1px solid var(--a);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;display:none}
.panel.on{display:block}
.panel .title{font-size:11px;font-weight:600;color:var(--a);margin-bottom:4px}
.panel .text{font-size:12px;color:var(--dim)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--b);border-top-color:var(--a);border-radius:50%;animation:spin .6s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;transition:.15s}
.card:hover{border-color:var(--dim)}
.card-name{font-size:14px;font-weight:600;color:var(--t);margin-bottom:6px}
.card-info{font-size:11px;color:var(--dim);margin-bottom:10px;line-height:1.6}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.abtn{flex:1;min-width:70px;padding:7px 4px;border:1px solid var(--b);border-radius:6px;font-family:inherit;font-size:10px;font-weight:600;cursor:pointer;background:var(--s2);color:var(--dim);transition:.15s;text-transform:uppercase;letter-spacing:.3px}
.abtn:hover{color:var(--t)}
.a-ed:hover{border-color:var(--w);color:var(--w)}
.a-h:hover{border-color:var(--a);color:var(--a)}
.a-r:hover{border-color:var(--g);color:var(--g)}
.a-del:hover{border-color:var(--d);color:var(--d)}
.empty{text-align:center;padding:50px 20px;color:var(--dim);font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--g);color:var(--t);padding:10px 20px;border-radius:6px;font-size:12px;font-weight:500;display:none;z-index:100}
.toast.err{border-color:var(--d)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" onclick="location.href='/gestion'">← Volver</button>
    <h1>Personas Registradas</h1>
    <span class="badge" id="cnt">0</span>
  </header>

  <button class="cta" onclick="location.href='/register'">+ Registrar Nueva Persona</button>

  <div id="panelProceso" class="panel">
    <div class="title"><span class="spin"></span><span id="panelTitulo">Procesando...</span></div>
    <div id="panelTexto" class="text">Espere un momento.</div>
  </div>

  <div id="lista"><div class="empty">Cargando...</div></div>
</div>
<div id="toast" class="toast"></div>

<script>
let timerProceso=null,procesoActivo='';

function mostrarToast(msg,tipo=''){
  const el=document.getElementById('toast');
  el.className='toast'+(tipo?' '+tipo:'');
  el.textContent=msg;el.style.display='block';
  setTimeout(()=>{el.style.display='none';},2600);
}
function mostrarPanel(titulo,texto){
  document.getElementById('panelTitulo').textContent=titulo;
  document.getElementById('panelTexto').textContent=texto;
  document.getElementById('panelProceso').classList.add('on');
}
function ocultarPanel(){document.getElementById('panelProceso').classList.remove('on');}
function textoEstado(c){return c===1?'Coloque el dedo (1ra vez).':c===4?'Retire el dedo.':c===2?'Coloque el dedo (2da vez).':c===3?'Mire a la cámara.':'Procesando...';}
function detenerSeguimiento(){if(timerProceso){clearInterval(timerProceso);timerProceso=null;}procesoActivo='';ocultarPanel();}

function iniciarSeguimiento(tipo,nombre){
  detenerSeguimiento();procesoActivo=tipo;
  mostrarPanel('Actualizando '+tipo,'Preparando para '+nombre+'...');
  timerProceso=setInterval(async()=>{
    try{
      const e=await fetch('/estado').then(r=>r.json());
      if(procesoActivo==='huella'){
        if(e.codigo_paso===0){detenerSeguimiento();mostrarToast('Huella actualizada','ok');cargar();return;}
        mostrarPanel('Actualizando huella',textoEstado(e.codigo_paso));
      }else if(procesoActivo==='rostro'){
        if(e.codigo_paso===0){detenerSeguimiento();mostrarToast(e.rostro_ok?'Rostro actualizado':e.error_registro||'Error facial',e.rostro_ok?'ok':'err');cargar();return;}
        mostrarPanel('Actualizando rostro',textoEstado(e.codigo_paso));
      }
    }catch(err){mostrarPanel('Esperando...','Reintentando...');}
  },1500);
}

async function cargar(){
  try{
    const personas=await fetch('/api/personas').then(r=>r.json());
    document.getElementById('cnt').textContent=personas.length;
    window.cachePersonas=personas;
    const lista=document.getElementById('lista');
    if(personas.length===0){lista.innerHTML='<div class="empty">No hay personas registradas</div>';return;}
    lista.innerHTML=personas.map((p,idx)=>`
      <div class="card">
        <div class="card-name">${p.nombre}</div>
        <div class="card-info">RUT: ${p.rut||'N/A'} &nbsp;|&nbsp; Email: ${p.email||'N/A'}<br>Huella ID: ${p.huella_id} &nbsp;|&nbsp; SYS ID: ${p.id}</div>
        <div class="actions">
          <button class="abtn a-ed" onclick="editarPersona(${idx})">Editar</button>
          <button class="abtn a-h" onclick="actualizarHuella(${idx})">Huella</button>
          <button class="abtn a-r" onclick="actualizarRostro(${idx})">Rostro</button>
          <button class="abtn a-del" onclick="borrarPersona('${p.id}')">Borrar</button>
        </div>
      </div>`).join('');
  }catch(e){document.getElementById('lista').innerHTML='<div class="empty">Error cargando datos</div>';}
}
async function borrarPersona(id){
  if(!confirm('¿Borrar registro y huella del reloj?'))return;
  try{const r=await fetch('/borrar_persona?id='+encodeURIComponent(id));mostrarToast(await r.text(),r.ok?'ok':'err');cargar();}catch(e){mostrarToast('Error al borrar','err');}
}
async function editarPersona(idx){
  const p=window.cachePersonas[idx];if(!p)return;
  const nombre=(prompt('Nuevo nombre:',p.nombre||'')||'').trim();if(!nombre)return;
  const email=(prompt('Nuevo email:',p.email||'')||'').trim();
  try{const r=await fetch(`/editar_persona?id=${encodeURIComponent(p.id)}&name=${encodeURIComponent(nombre)}&email=${encodeURIComponent(email)}`);mostrarToast(await r.text(),r.ok?'ok':'err');cargar();}catch(e){mostrarToast('Error al editar','err');}
}
async function actualizarHuella(idx){
  const p=window.cachePersonas[idx];if(!p)return;
  if(!confirm('Actualizar huella de '+p.nombre+'?'))return;
  try{const r=await fetch('/actualizar_huella?id='+encodeURIComponent(p.id));const msg=await r.text();if(!r.ok){mostrarToast(msg,'err');return;}mostrarToast(msg,'ok');iniciarSeguimiento('huella',p.nombre);}catch(e){mostrarToast('Error','err');}
}
async function actualizarRostro(idx){
  const p=window.cachePersonas[idx];if(!p)return;
  if(!confirm('Actualizar rostro de '+p.nombre+'?'))return;
  try{const r=await fetch('/actualizar_rostro?id='+encodeURIComponent(p.id));const msg=await r.text();if(!r.ok){mostrarToast(msg,'err');return;}mostrarToast(msg,'ok');iniciarSeguimiento('rostro',p.nombre);}catch(e){mostrarToast('Error','err');}
}
cargar();setInterval(cargar,10000);
</script>
</body>
</html>
