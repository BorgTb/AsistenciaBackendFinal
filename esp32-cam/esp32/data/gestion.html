<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SAS · Gestión de Turnos</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root{--bg:#0f172a;--surface:#1e293b;--surface-2:#334155;--border:#475569;--primary:#1d4ed8;--primary-light:#1e40af;--success:#16a34a;--warning:#d97706;--danger:#dc2626;--text:#f1f5f9;--muted:#94a3b8;--muted-2:#64748b;--line:rgba(255,255,255,.08);--radius:8px;--radius-lg:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:16px 12px}

.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:.15s}
.back:hover{background:var(--surface-2)}
.top h1{font-size:15px;font-weight:700;flex:1;text-align:center;letter-spacing:-.3px}

.section-label{font-size:9px;color:var(--muted-2);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin:14px 0 8px;padding-left:10px;border-left:3px solid var(--primary);display:flex;justify-content:space-between;align-items:center}
.section-label .cnt{font-weight:700;color:var(--primary);font-size:12px}

.list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:6px;max-height:220px;overflow-y:auto;margin-bottom:8px}
.list::-webkit-scrollbar{width:4px}.list::-webkit-scrollbar-track{background:var(--surface)}.list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.item{padding:10px 12px;margin:4px 0;background:var(--surface-2);border-left:3px solid var(--primary);border-radius:4px;font-size:12px}
.item strong{display:block;color:var(--text);margin-bottom:3px}
.item span{color:var(--muted);font-size:10px}

.btn{display:block;width:100%;padding:11px;border:1px solid var(--primary);border-radius:6px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:6px;color:var(--primary);background:transparent;transition:.15s;text-align:center;text-decoration:none}
.btn:hover{background:var(--primary);color:#fff}
.btn-secondary{background:var(--surface);border-color:var(--border);color:var(--muted)}
.btn-secondary:hover{background:var(--surface-2);color:var(--text);border-color:var(--muted-2)}
.btn-success{background:var(--surface);border-color:rgba(22,163,74,.4);color:var(--success)}
.btn-success:hover{background:rgba(22,163,74,.1);border-color:var(--success);color:var(--success)}

.empty{text-align:center;padding:30px 20px;color:var(--muted-2);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="back" onclick="location.href='/'">← Inicio</button>
    <h1>Gestión de Turnos</h1>
  </div>

  <div class="section-label">Turnos <span class="cnt" id="countTurnos">0</span></div>
  <div class="list" id="listTurnos"><div class="empty">Cargando...</div></div>
  <button class="btn" onclick="location.href='/turnos'">Gestionar Turnos</button>

  <div class="section-label">Asignaciones <span class="cnt" id="countAsignaciones">0</span></div>
  <div class="list" id="listAsignaciones"><div class="empty">Cargando...</div></div>
  <button class="btn" onclick="location.href='/asignaciones'">Gestionar Asignaciones</button>

  <div class="section-label">Sincronización</div>
  <button class="btn btn-success" id="btnSincronizar" onclick="sincronizarTodo()">Sincronizar todo con la plataforma</button>
  <div id="noEnroladoMsg" style="display:none;padding:8px 12px;background:rgba(217,119,6,.08);border:1px solid rgba(217,119,6,.2);border-radius:6px;color:var(--warning);font-size:11px;margin-bottom:6px">Dispositivo sin enrolar. Sincronizacion no disponible.</div>
  <button class="btn btn-secondary" onclick="location.href='/'">Volver al inicio</button>
</div>

<script>
let personas=[],turnos=[],asignaciones=[];
const ADMIN_PW_KEY='sas_admin_session';
let adminHabilitado=false;
async function mostrarModalPassword(errorMsg){
  return new Promise(resolve=>{
    const ov=document.createElement('div');
    ov.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;font-family:sans-serif';
    ov.innerHTML='<div style="background:#1e293b;padding:24px;border-radius:8px;max-width:320px;width:90%;text-align:center;border:1px solid #475569">'
      +'<h2 style="color:#f1f5f9;margin:0 0 16px;font-size:16px">&#x1F512; Contrase&ntilde;a requerida</h2>'
      +'<input type="password" id="apw" style="width:100%;padding:10px;border:1px solid #475569;border-radius:6px;background:#0f172a;color:#f1f5f9;font-size:14px;margin-bottom:12px;box-sizing:border-box" placeholder="Ingrese contrase&ntilde;a"'+(errorMsg?'':' autofocus')+'>'
      +(errorMsg?'<div style="color:#ef4444;font-size:12px;margin-bottom:8px">'+errorMsg+'</div>':'')
      +'<button id="apb" style="width:100%;padding:10px;background:#1d4ed8;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer">Ingresar</button>'
      +'<button id="apc" style="width:100%;padding:8px;background:transparent;color:#94a3b8;border:none;border-radius:6px;font-size:12px;cursor:pointer;margin-top:6px">Cancelar</button></div>';
    document.body.appendChild(ov);
    const inp=ov.querySelector('#apw'),btn=ov.querySelector('#apb'),can=ov.querySelector('#apc');
    inp.focus();
    btn.onclick=()=>{const v=inp.value.trim();if(v){document.body.removeChild(ov);resolve(v);}else inp.focus();};
    can.onclick=()=>{document.body.removeChild(ov);resolve(null);};
    inp.onkeydown=e=>{if(e.key==='Enter')btn.onclick();};
  });
}
async function verificarAcceso(){
  try{
    const e=await fetch('/estado').then(r=>r.json());
    adminHabilitado=e.admin_protegido||false;
    if(!adminHabilitado)return true;
    let pw=sessionStorage.getItem(ADMIN_PW_KEY);
    if(pw){
      const t=await fetch('/api/logs?admin_password='+encodeURIComponent(pw));
      if(t.ok)return true;
      sessionStorage.removeItem(ADMIN_PW_KEY);
    }
    pw=await mostrarModalPassword();
    while(pw){
      const t=await fetch('/api/logs?admin_password='+encodeURIComponent(pw));
      if(t.ok){sessionStorage.setItem(ADMIN_PW_KEY,pw);return true;}
      pw=await mostrarModalPassword('Contrase&ntilde;a incorrecta');
    }
    document.body.innerHTML='<div style="padding:2em;text-align:center;font-family:sans-serif"><h2>&#x1F512; Acceso denegado</h2><p>Se requiere contrase&ntilde;a de administrador para ver esta p&aacute;gina.</p></div>';
    return false;
  }catch(e){return true;}
}
async function fetchProtegido(url){
  if(!adminHabilitado)return fetch(url);
  let pw=sessionStorage.getItem(ADMIN_PW_KEY);
  if(!pw)return null;
  const sep=url.includes('?')?'&':'?';
  const r=await fetch(url+sep+'admin_password='+encodeURIComponent(pw));
  if(r.status===401){sessionStorage.removeItem(ADMIN_PW_KEY);alert('Contrase&ntilde;a incorrecta. Recargue la p&aacute;gina.');return null;}
  return r;
}
async function cargarPersonas(){try{personas=await fetchProtegido('/api/personas').then(r=>r.json());}catch(e){}}
async function cargarTurnos(){
  try{
    turnos=await fetchProtegido('/api/turnos').then(r=>r.json());
    document.getElementById('countTurnos').textContent=turnos.length;
    const c=document.getElementById('listTurnos');
    if(!turnos.length){c.innerHTML='<div class="empty">No hay turnos</div>';return;}
    c.innerHTML=turnos.map(t=>`<div class="item"><strong>${t.nombre}</strong><span>${t.inicio} – ${t.fin} &nbsp;|&nbsp; ${t.dias}</span></div>`).join('');
  }catch(e){document.getElementById('listTurnos').innerHTML='<div class="empty">Error</div>';}
}
async function cargarAsignaciones(){
  try{
    asignaciones=await fetchProtegido('/api/asignaciones').then(r=>r.json());
    document.getElementById('countAsignaciones').textContent=asignaciones.length;
    const c=document.getElementById('listAsignaciones');
    if(!asignaciones.length){c.innerHTML='<div class="empty">No hay asignaciones</div>';return;}
    c.innerHTML=asignaciones.map(a=>{
      const p=personas.find(x=>x.id===a.persona_id);
      const t=turnos.find(x=>x.id===a.turno_id);
      return `<div class="item"><strong>${p?p.nombre:'ID '+a.persona_id}</strong><span>→ ${t?t.nombre:'ID '+a.turno_id}</span></div>`;
    }).join('');
  }catch(e){document.getElementById('listAsignaciones').innerHTML='<div class="empty">Error</div>';}
}
async function sincronizarTodo(){
  try{const r=await fetchProtegido('/sincronizar');if(!r)return;alert(await r.text());await Promise.all([cargarPersonas(),cargarTurnos(),cargarAsignaciones()]);}
  catch(e){alert('Error: '+e.message);}
}
async function init(){
  await cargarPersonas();
  await Promise.all([cargarTurnos(),cargarAsignaciones()]);
  try{
    const e = await fetch('/estado').then(r=>r.json());
    document.getElementById('btnSincronizar').style.display = e.enrolado ? 'block' : 'none';
    document.getElementById('noEnroladoMsg').style.display = (!e.enrolado && e.online) ? 'block' : 'none';
  }catch(err){}
}
(async function(){
  if(!await verificarAcceso())return;
  init();setInterval(()=>{cargarPersonas();cargarTurnos();cargarAsignaciones();},30000);
})();
</script>
</body>
</html>
