<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Gestión de Asignaciones</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0f14;--surface:#141720;--surface2:#1a1e2b;--border:#252a3a;--accent:#00e5a0;--accent2:#3d8ef8;--warn:#f59e0b;--danger:#ef4444;--text:#e2e8f0;--dim:#6b7a99;--r:4px}
body{font-family:'Courier New',Courier,monospace;background:var(--bg);color:var(--text);min-height:100vh;padding:12px}
.wrap{max-width:600px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:14px 0 10px;border-bottom:1px solid var(--border);margin-bottom:14px}
.back{background:none;border:1px solid var(--border);color:var(--dim);padding:5px 10px;border-radius:var(--r);font-family:inherit;font-size:11px;cursor:pointer;letter-spacing:1px}
.back:hover{color:var(--text);border-color:var(--dim)}
h1{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);flex:1;text-align:center}
.section-head{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:8px;padding-left:8px;border-left:2px solid var(--border)}
.form-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:14px}
select{width:100%;padding:9px 11px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:inherit;font-size:12px;margin-bottom:10px;transition:.15s;-webkit-appearance:none}
select:focus{outline:none;border-color:var(--accent)}
.btn{width:100%;padding:10px;border:none;border-radius:var(--r);font-family:inherit;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;background:var(--warn);color:#0d0f14;margin-bottom:6px}
.btn:hover{background:#e08c00}
.btn-back{background:var(--surface);border:1px solid var(--border);color:var(--dim);margin-top:6px}
.btn-back:hover{color:var(--text);border-color:var(--dim)}
.item{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:var(--r);padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item-info{flex:1}
.item-name{font-size:12px;font-weight:700;color:var(--text)}
.item-meta{font-size:10px;color:var(--dim);margin-top:2px}
.del-btn{background:none;border:1px solid var(--border);color:var(--dim);padding:5px 8px;border-radius:var(--r);font-family:inherit;font-size:10px;cursor:pointer;flex-shrink:0}
.del-btn:hover{border-color:var(--danger);color:var(--danger)}
.empty{text-align:center;padding:20px;color:var(--dim);font-size:11px}
.status{font-size:11px;color:var(--dim);text-align:center;padding:6px;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" onclick="window.location.href='/gestion'">← VOLVER</button>
    <h1>Asignaciones</h1>
  </header>

  <div class="section-head">Asignar Turno a Persona</div>
  <div class="form-box">
    <select id="selectPersona"><option value="">Cargando personas...</option></select>
    <select id="selectTurno"><option value="">Cargando turnos...</option></select>
    <button class="btn" onclick="asignarTurno()">▶ ASIGNAR TURNO</button>
    <div class="status" id="status"></div>
  </div>

  <div class="section-head">Asignaciones Actuales</div>
  <div id="listaAsignaciones"><div class="empty">Cargando...</div></div>

  <button class="btn btn-back" onclick="window.location.href='/gestion'">← VOLVER</button>
</div>

<script>
let personas=[],turnos=[];
async function cargarPersonas(){
  try{
    personas=await fetch('/api/personas').then(r=>r.json());
    const s=document.getElementById('selectPersona');
    s.innerHTML='<option value="">Seleccione persona...</option>'+personas.map(p=>`<option value="${p.id}">${p.nombre}</option>`).join('');
  }catch(e){}
}
async function cargarTurnos(){
  try{
    turnos=await fetch('/api/turnos').then(r=>r.json());
    const s=document.getElementById('selectTurno');
    s.innerHTML='<option value="">Seleccione turno...</option>'+turnos.map(t=>`<option value="${t.id}">${t.nombre} (${t.inicio}–${t.fin})</option>`).join('');
  }catch(e){}
}
async function cargarAsignaciones(){
  try{
    const asig=await fetch('/api/asignaciones').then(r=>r.json());
    const lista=document.getElementById('listaAsignaciones');
    if(!asig.length){lista.innerHTML='<div class="empty">No hay asignaciones</div>';return;}
    lista.innerHTML=asig.map(a=>{
      const p=personas.find(x=>x.id===a.persona_id);
      const t=turnos.find(x=>x.id===a.turno_id);
      return `<div class="item">
        <div class="item-info">
          <div class="item-name">${p?p.nombre:'ID '+a.persona_id} → ${t?t.nombre:'ID '+a.turno_id}</div>
          <div class="item-meta">PERSONA: ${a.persona_id} &nbsp;|&nbsp; TURNO: ${a.turno_id}</div>
        </div>
        <button class="del-btn" onclick="borrarAsignacion('${a.persona_id}','${a.turno_id}')">✕ QUITAR</button>
      </div>`;
    }).join('');
  }catch(e){document.getElementById('listaAsignaciones').innerHTML='<div class="empty">Error</div>';}
}
async function borrarAsignacion(idP,idT){
  if(!confirm('¿Eliminar esta asignación?'))return;
  try{alert(await fetch(`/borrar_asignacion?persona=${idP}&turno=${idT}`).then(r=>r.text()));cargarAsignaciones();}
  catch(e){alert('Error al borrar');}
}
async function asignarTurno(){
  const persona=document.getElementById('selectPersona').value;
  const turno=document.getElementById('selectTurno').value;
  if(!persona||!turno){alert('Seleccione persona y turno');return;}
  try{
    const msg=await fetch(`/asignar?persona=${persona}&turno=${turno}`).then(r=>r.text());
    document.getElementById('status').textContent=msg;
    if(msg.includes('asignado'))cargarAsignaciones();
  }catch(e){document.getElementById('status').textContent='Error: '+e.message;}
}
async function init(){await Promise.all([cargarPersonas(),cargarTurnos()]);cargarAsignaciones();}
init();setInterval(()=>{cargarPersonas();cargarTurnos();cargarAsignaciones();},15000);
</script>
</body>
</html>
