<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ESP32 · Sistema Asistencia</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0f14;--surface:#141720;--surface2:#1a1e2b;--border:#252a3a;--accent:#00e5a0;--accent2:#3d8ef8;--warn:#f59e0b;--danger:#ef4444;--text:#e2e8f0;--dim:#6b7a99;--r:4px}
body{font-family:'Courier New',Courier,monospace;background:var(--bg);color:var(--text);min-height:100vh;padding:12px}
.wrap{max-width:480px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:14px 0 10px;border-bottom:1px solid var(--border);margin-bottom:14px}
.logo{width:32px;height:32px;border:2px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--accent);font-weight:700;flex-shrink:0}
h1{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}
h1 span{display:block;font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:1px}
.status-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.stat{text-align:center}
.stat-label{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.stat-val{font-size:12px;font-weight:700;margin-top:2px}
.online{color:var(--accent)}.offline{color:var(--danger)}.active{color:var(--accent)}
section{margin-bottom:12px}
.section-head{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:6px;padding-left:2px;border-left:2px solid var(--border);padding-left:8px}
.btn{display:block;width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text);font-family:inherit;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;text-align:left;margin-bottom:6px;transition:.15s;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.btn:hover{background:var(--surface2);border-color:var(--dim)}
.btn-accent::before{background:var(--accent)}.btn-accent{border-left-color:var(--accent)}
.btn-blue::before{background:var(--accent2)}.btn-blue{border-left-color:var(--accent2)}
.btn-warn::before{background:var(--warn)}.btn-warn{border-left-color:var(--warn)}
.btn-danger{border-left-color:var(--danger)}.btn-danger::before{background:var(--danger)}
.btn-icon{float:right;opacity:.5;font-size:14px}
.toast{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-top:10px;font-size:11px;color:var(--dim);min-height:36px;line-height:1.5}
.toast.active{border-color:var(--accent);color:var(--text)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;animation:blink 1.2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">32</div>
    <h1>Sistema Asistencia<span>ESP32-CAM · BIOMÉTRICO</span></h1>
  </header>

  <div class="status-bar">
    <div class="stat"><div class="stat-label">Modo</div><div class="stat-val offline" id="modoEstado">OFFLINE</div></div>
    <div class="stat"><div class="stat-label">Sensor</div><div class="stat-val active">ACTIVO</div></div>
    <div class="stat"><div class="stat-label">Enrolado</div><div class="stat-val" id="enrolEstado" style="color:var(--warn)">PEND.</div></div>
  </div>

  <section>
    <div class="section-head">Registro</div>
    <button class="btn btn-warn" onclick="window.location.href='/register'"><span class="btn-icon">›</span>Registrar Persona</button>
  </section>

  <section>
    <div class="section-head">Gestión</div>
    <button class="btn btn-blue" onclick="window.location.href='/gestion'"><span class="btn-icon">›</span>Gestión de Turnos</button>
    <button class="btn btn-accent" onclick="window.location.href='/asistencias'"><span class="btn-icon">›</span>Ver Asistencias</button>
    <button class="btn btn-accent" onclick="window.location.href='/personas'"><span class="btn-icon">›</span>Ver Personas</button>
    <button class="btn btn-accent" onclick="window.location.href='/logs'"><span class="btn-icon">›</span>Ver Logs</button>
    <button class="btn btn-blue" onclick="sincronizarTodo()"><span class="btn-icon">↑</span>Sincronizar con Backend</button>
    <button class="btn btn-blue" onclick="window.location.href='/wifi-setup'"><span class="btn-icon">›</span>Configurar WiFi</button>
  </section>

  <section>
    <div class="section-head">Zona Peligro</div>
    <button class="btn btn-danger" onclick="limpiarDatos()"><span class="btn-icon">⚠</span>Limpiar Todos los Datos</button>
  </section>

  <div class="toast" id="status"><span class="dot"></span>Sistema listo</div>
</div>

<script>
function traducirMotivo(m){
  const map={habilitada:'ACTIVA',sistema_ocupado:'OCUPADO',cooldown:'COOLDOWN',bloqueo_menu:'BLOQUEADO',sin_personas_locales:'SIN PERSONAS',sin_asignaciones_locales:'SIN ASIGNAC.'};
  return map[m]||m||'--';
}
async function actualizarEstado(){
  try{
    const e=await fetch('/estado').then(r=>r.json());
    const m=document.getElementById('modoEstado');
    m.textContent=e.online?'ONLINE':'OFFLINE';
    m.className='stat-val '+(e.online?'online':'offline');
    const a=document.getElementById('enrolEstado');
    a.textContent=e.enrolado?'ENROLADO':'PEND.';
    a.style.color=e.enrolado?'var(--accent)':'var(--warn)';
  }catch(err){}
}
function setStatus(msg,ok=true){
  const el=document.getElementById('status');
  el.className='toast active';
  el.innerHTML=msg.replace(/\n/g,'<br>');
  el.style.borderColor=ok?'var(--accent)':'var(--warn)';
  setTimeout(()=>{el.className='toast';el.innerHTML='<span class="dot"></span>Sistema listo';el.style.borderColor='';},5000);
}
async function limpiarDatos(){
  const codigo=prompt('ADVERTENCIA: Se eliminarán TODOS los datos.\nIngrese el código de seguridad:');
  if(!codigo)return;
  if(!confirm('¿Confirmar eliminación total?'))return;
  setStatus('Limpiando datos...');
  try{const r=await fetch('/limpiar?codigo='+encodeURIComponent(codigo));const msg=await r.text();setStatus(msg);if(msg.includes('correctamente'))setTimeout(()=>location.reload(),3000);}catch(e){setStatus('Error: '+e.message,false);}
}
async function sincronizarTodo(){
  setStatus('Sincronizando...');
  try{const r=await fetch('/sincronizar');const msg=await r.text();setStatus(msg);}catch(e){setStatus('Error: '+e.message,false);}
}
actualizarEstado();
setInterval(actualizarEstado,3000);
</script>
</body>
</html>
