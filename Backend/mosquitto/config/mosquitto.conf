# mosquitto/config/mosquitto.conf
# ============================================================
# SECURE_MODE=false  → backend usa puerto 1883 (plain, anonymous)
# SECURE_MODE=true   → backend usa puerto 8883 (TLS + password)
# Ambos puertos siempre están abiertos en el broker.
# ============================================================

# --- Puerto MQTT plano (sin TLS, sin autenticación) ---
listener 1883
allow_anonymous true

# --- Puerto MQTT con TLS + autenticación por contraseña ---
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
allow_anonymous false
password_file /mosquitto/config/passwd/passwd

# --- Puerto WebSocket (plano, para frontend en desarrollo) ---
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd/passwd