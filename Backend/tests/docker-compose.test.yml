services:
  postgres_test:
    image: postgres:15
    container_name: sas_test_db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test_db"]
      interval: 1s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
