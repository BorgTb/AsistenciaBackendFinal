<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Registro Biométrico - Con Verificación</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#1e3c72 0%,#2a5298 100%);min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center}
.container{background:white;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.3);padding:30px;max-width:500px;width:100%}
h1{color:#333;text-align:center;margin-bottom:20px;font-size:24px}
.form-group{margin-bottom:15px}
label{display:block;color:#333;font-weight:600;margin-bottom:5px;font-size:14px}
input{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:14px;transition:0.3s}
input:focus{outline:none;border-color:#2a5298}
button{width:100%;padding:14px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px;color:white;transition:0.3s}
button:hover{transform:scale(1.02)}
.btn-success{background:#4CAF50}
.btn-secondary{background:#6c757d}

/* --- ESTILOS DEL STEPPER --- */
#biometric-process{display:none;text-align:center}
.step-box{background:#f9f9f9;border:2px solid #eee;border-radius:10px;padding:20px;margin-bottom:15px;opacity:0.4;transition:0.5s}
.step-box.active{opacity:1;border-color:#2a5298;background:#e3f2fd;transform:scale(1.05);box-shadow:0 5px 15px rgba(42,82,152,0.2)}
.step-box.done{opacity:1;border-color:#4CAF50;background:#e8f5e9}
.step-icon{font-size:40px;margin-bottom:10px}
.step-title{font-weight:bold;color:#333;font-size:16px}
.camera-flash{animation: flash 0.8s infinite alternate;}
@keyframes flash {
    0% { color: #333; text-shadow: none; transform: scale(1); }
    100% { color: #ffeb3b; text-shadow: 0 0 20px #ffeb3b; transform: scale(1.2); }
}
#previewImage{display:none;max-width:200px;border-radius:10px;margin:10px auto;border:3px solid #ddd;box-shadow: 0 3px 6px rgba(0,0,0,0.1);}
</style>
</head>
<body>

<div class="container">
    <h1>Alta de Trabajador</h1>

    <div id="form-container">
        <div class="form-group">
            <label>Nombre Completo</label>
            <input type="text" id="personName" placeholder="Ej: Juan Perez" required>
        </div>
        <div class="form-group">
            <label>RUT</label>
            <input type="text" id="personRut" placeholder="Ej: 12345678-9" required>
        </div>
        <div class="form-group">
            <label>Email Corporativo</label>
            <input type="email" id="personEmail" placeholder="Ej: juan@empresa.com" required>
        </div>
        <button class="btn-success" onclick="iniciarRegistro()">Iniciar Escaneo</button>
        <button class="btn-secondary" onclick="window.location.href='/'">Cancelar</button>
    </div>

    <div id="biometric-process">
        <div class="step-box" id="step1">
            <div class="step-icon">👆</div>
            <div class="step-title">1. Coloque el dedo en el sensor</div>
            <small>Mantenga presionado firmemente</small>
        </div>

        <div class="step-box" id="step2">
            <div class="step-icon">👆</div>
            <div class="step-title">2. Levante y vuelva a colocarlo</div>
            <small>Para confirmar la plantilla biométrica</small>
        </div>

        <div class="step-box" id="step3">
            <div class="step-icon" id="camIcon">📸</div>
            <img id="previewImage"> 
            <div class="step-title">3. Mire a la cámara del Reloj</div>
            <small id="camSmall" style="font-weight:bold;">Se registrará su rostro en la Base de Datos</small>
        </div>

        <button class="btn-success" id="btn-finish" style="display:none;" onclick="window.location.reload()">Registrar a otra persona</button>
        <button class="btn-secondary" onclick="window.location.href='/'">Volver al Inicio</button>
    </div>

    <div id="terminal-container" style="display:none; margin-top: 20px;">
        <h4 style="color: #333; font-size: 13px; margin-bottom: 5px;">Consola del Sistema:</h4>
        <div id="terminal" style="background: #1e1e1e; color: #00ff00; font-family: monospace; font-size: 12px; padding: 10px; height: 120px; overflow-y: auto; border-radius: 8px; border: 2px solid #333; line-height: 1.4;">
            Cargando logs...
        </div>
    </div>
</div>

<script>
let checkInterval;
let stepActual = 0;
// NUEVO: Función para inyectar los logs del ESP32
async function actualizarTerminal() {
    // Solo actualiza si la terminal está visible
    if (document.getElementById('terminal-container').style.display !== 'block') return;

    try {
        const r = await fetch('/logs');
        const html = await r.text();
        
        // Usamos DOMParser para extraer solo el contenido del <div> de los logs
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const logsExtraidos = doc.querySelector('div').innerHTML; 
        
        const terminal = document.getElementById('terminal');
        
        // Solo actualizamos si hay texto nuevo (para no parpadear)
        if (terminal.innerHTML !== logsExtraidos) {
            terminal.innerHTML = logsExtraidos;
            // Scroll automático hacia el final
            terminal.scrollTop = terminal.scrollHeight;
        }
    } catch(e) {
        console.log("Error leyendo logs");
    }
}

// Ejecutar la actualización de la terminal cada 1 segundo
setInterval(actualizarTerminal, 1000);
async function iniciarRegistro() {
    const nombre = document.getElementById('personName').value.trim();
    const rut = document.getElementById('personRut').value.trim();
    const email = document.getElementById('personEmail').value.trim();
    
    if(!nombre || !rut || !email) return alert('Por favor complete todos los datos.');

    try {
        const r = await fetch('/registrar?name=' + encodeURIComponent(nombre) + '&rut=' + encodeURIComponent(rut) + '&email=' + encodeURIComponent(email));
        if(r.ok) {
            document.getElementById('form-container').style.display = 'none';
            // ... dentro de iniciarRegistro(), justo debajo de donde ocultas el form:
document.getElementById('form-container').style.display = 'none';
document.getElementById('biometric-process').style.display = 'block';
document.getElementById('terminal-container').style.display = 'block'; // <--- Mostrar terminal
            document.getElementById('biometric-process').style.display = 'block';
            marcarPasoActivo(1);
            checkInterval = setInterval(monitorearHardware, 800); // Polling ligero
        } else {
            alert("Error: " + await r.text());
        }
    } catch(e) { alert('Error de conexión.'); }
}

async function monitorearHardware() {
    try {
        const r = await fetch('/estado');
        const data = await r.json();
        
        // Mapeo Inteligente de la Máquina de Estados del ESP32
        if (data.codigo_paso === 1 && stepActual !== 1) marcarPasoActivo(1);
        if (data.codigo_paso === 2 && stepActual !== 2) marcarPasoActivo(2);
        
        if (data.codigo_paso === 3) {
            if(stepActual !== 3) marcarPasoActivo(3);
            
            // Lógica de alerta por reintentos visuales
            const camSmall = document.getElementById('camSmall');
            if (data.intentos_facial > 0) {
                if(data.intentos_facial === 1) {
                    camSmall.innerText = "Procesando... Mantenga la mirada.";
                    camSmall.style.color = "#2a5298";
                } else {
                    camSmall.innerText = `Rostro no detectado. Reintentando... (${data.intentos_facial}/6)`;
                    camSmall.style.color = "#f44336"; // Rojo alerta
                }
            }
        }
        
        // Si el hardware terminó y volvió a IDLE (0)
        if (data.codigo_paso === 0 && stepActual >= 2) {
            marcarExito();
        }
    } catch(e) {
        console.log("Aguardando procesador...");
    }
}

function marcarPasoActivo(paso) {
    stepActual = paso;
    document.getElementById('step1').className = 'step-box';
    document.getElementById('step2').className = 'step-box';
    document.getElementById('step3').className = 'step-box';
    document.getElementById('camIcon').classList.remove('camera-flash');

    if(paso === 1) document.getElementById('step1').classList.add('active');
    if(paso === 2) {
        document.getElementById('step1').classList.add('done');
        document.getElementById('step2').classList.add('active');
    }
    if(paso === 3) {
        document.getElementById('step1').classList.add('done');
        document.getElementById('step2').classList.add('done');
        document.getElementById('step3').classList.add('active');
        document.getElementById('camIcon').classList.add('camera-flash');
    }
}

async function marcarExito() {
    clearInterval(checkInterval);
    document.getElementById('step1').className = 'step-box done';
    document.getElementById('step2').className = 'step-box done';
    
    const step3 = document.getElementById('step3');
    const camIcon = document.getElementById('camIcon');
    const prevImg = document.getElementById('previewImage');
    
    camIcon.classList.remove('camera-flash');

    try {
        const r = await fetch('/ultimo_registro');
        const summary = await r.json();
        
        step3.className = 'step-box done';
        camIcon.style.display = 'none'; 
        step3.querySelector('.step-title').innerText = "¡Registro Completo!";
        document.getElementById('camSmall').innerText = `Rostro y huella asociados a: ${summary.nombre}`;
        document.getElementById('camSmall').style.color = "#4CAF50";
        
        if (summary.imagen_url && summary.imagen_url !== "") {
            prevImg.src = summary.imagen_url;
            prevImg.style.display = 'block';
        }
    } catch(e) {
        step3.className = 'step-box done';
        step3.querySelector('.step-title').innerText = "¡Registro Finalizado!";
        document.getElementById('camSmall').innerText = "Hardware listo. Verifique BD para la foto.";
    }

    document.getElementById('btn-finish').style.display = 'block';
}
</script>
</body>
</html>
