<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Gestión de Turnos</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0f14;--surface:#141720;--surface2:#1a1e2b;--border:#252a3a;--accent:#00e5a0;--accent2:#3d8ef8;--warn:#f59e0b;--danger:#ef4444;--text:#e2e8f0;--dim:#6b7a99;--r:4px}
body{font-family:'Courier New',Courier,monospace;background:var(--bg);color:var(--text);min-height:100vh;padding:12px}
.wrap{max-width:600px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:14px 0 10px;border-bottom:1px solid var(--border);margin-bottom:14px}
.back{background:none;border:1px solid var(--border);color:var(--dim);padding:5px 10px;border-radius:var(--r);font-family:inherit;font-size:11px;cursor:pointer;letter-spacing:1px}
.back:hover{color:var(--text);border-color:var(--dim)}
h1{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);flex:1;text-align:center}
.section-head{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:8px;padding-left:8px;border-left:2px solid var(--border)}
.form-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:14px}
label{display:block;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
input[type=text],input[type=time]{width:100%;padding:9px 11px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:inherit;font-size:13px;margin-bottom:10px;transition:.15s;color-scheme:dark}
input:focus{outline:none;border-color:var(--accent);background:var(--surface2)}
.time-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dias-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:6px 0 10px}
.dia{padding:9px 0;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);color:var(--dim);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;text-align:center;transition:.15s}
.dia:hover{border-color:var(--dim)}
.dia.on{background:var(--accent);color:#0d0f14;border-color:var(--accent)}
.hint{font-size:10px;color:var(--dim);margin-bottom:10px}
.btn{width:100%;padding:10px;border:none;border-radius:var(--r);font-family:inherit;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;background:var(--accent);color:#0d0f14;margin-bottom:6px}
.btn:hover{background:#00c98e}
.btn-back{background:var(--surface);border:1px solid var(--border);color:var(--dim);margin-top:6px}
.btn-back:hover{color:var(--text);border-color:var(--dim)}
.item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item-info{flex:1}
.item-name{font-size:12px;font-weight:700;color:var(--text)}
.item-meta{font-size:10px;color:var(--dim);margin-top:2px}
.del-btn{background:none;border:1px solid var(--border);color:var(--dim);padding:5px 8px;border-radius:var(--r);font-family:inherit;font-size:10px;cursor:pointer;flex-shrink:0}
.del-btn:hover{border-color:var(--danger);color:var(--danger)}
.empty{text-align:center;padding:20px;color:var(--dim);font-size:11px}
.status{font-size:11px;color:var(--dim);text-align:center;padding:6px;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" onclick="window.location.href='/gestion'">← VOLVER</button>
    <h1>Gestión de Turnos</h1>
  </header>

  <div class="section-head">Crear Nuevo Turno</div>
  <div class="form-box">
    <label>Nombre del Turno</label>
    <input type="text" id="turnoNombre" placeholder="Ej: Turno Mañana">
    <div class="time-row">
      <div><label>Inicio</label><input type="time" id="turnoInicio" value="08:00"></div>
      <div><label>Fin</label><input type="time" id="turnoFin" value="16:00"></div>
    </div>
    <label>Días</label>
    <div class="dias-grid" id="diasPicker">
      <button type="button" class="dia on" data-dia="L" onclick="toggleDia(this)">L</button>
      <button type="button" class="dia on" data-dia="M" onclick="toggleDia(this)">M</button>
      <button type="button" class="dia on" data-dia="X" onclick="toggleDia(this)">X</button>
      <button type="button" class="dia on" data-dia="J" onclick="toggleDia(this)">J</button>
      <button type="button" class="dia on" data-dia="V" onclick="toggleDia(this)">V</button>
      <button type="button" class="dia" data-dia="S" onclick="toggleDia(this)">S</button>
      <button type="button" class="dia" data-dia="D" onclick="toggleDia(this)">D</button>
    </div>
    <div class="hint" id="diasPreview">Días: L,M,X,J,V</div>
    <button class="btn" onclick="crearTurno()">+ CREAR TURNO</button>
    <div class="status" id="status"></div>
  </div>

  <div class="section-head">Turnos Existentes</div>
  <div id="listaTurnos"><div class="empty">Cargando...</div></div>

  <button class="btn btn-back" onclick="window.location.href='/gestion'">← VOLVER</button>
</div>

<script>
const ordenDias=['L','M','X','J','V','S','D'];
const selec=new Set(['L','M','X','J','V']);

function renderDias(){
  const dias=ordenDias.filter(d=>selec.has(d));
  document.getElementById('diasPreview').textContent='Días: '+(dias.length?dias.join(','):'(ninguno)');
  document.querySelectorAll('.dia').forEach(b=>b.classList.toggle('on',selec.has(b.dataset.dia)));
}
function toggleDia(b){const d=b.dataset.dia;selec.has(d)?selec.delete(d):selec.add(d);renderDias();}

async function cargarTurnos(){
  try{
    const turnos=await fetch('/api/turnos').then(r=>r.json());
    const lista=document.getElementById('listaTurnos');
    if(!turnos.length){lista.innerHTML='<div class="empty">No hay turnos creados</div>';return;}
    lista.innerHTML=turnos.map(t=>`
      <div class="item">
        <div class="item-info">
          <div class="item-name">${t.nombre}</div>
          <div class="item-meta">${t.inicio} – ${t.fin} &nbsp;|&nbsp; ${t.dias} &nbsp;|&nbsp; ID: ${t.id}</div>
        </div>
        <button class="del-btn" onclick="borrarTurno('${t.id}')">✕ BORRAR</button>
      </div>`).join('');
  }catch(e){document.getElementById('listaTurnos').innerHTML='<div class="empty">Error</div>';}
}
async function borrarTurno(id){
  if(!confirm('¿Borrar este turno?'))return;
  try{alert(await fetch('/borrar_turno?id='+encodeURIComponent(id)).then(r=>r.text()));cargarTurnos();}
  catch(e){alert('Error al borrar');}
}
async function crearTurno(){
  const nombre=document.getElementById('turnoNombre').value;
  const inicio=document.getElementById('turnoInicio').value;
  const fin=document.getElementById('turnoFin').value;
  const dias=ordenDias.filter(d=>selec.has(d)).join(',');
  if(!nombre||!inicio||!fin){alert('Complete todos los campos');return;}
  if(!dias){alert('Seleccione al menos un día');return;}
  try{
    const r=await fetch(`/crear_turno?nombre=${encodeURIComponent(nombre)}&inicio=${inicio}&fin=${fin}&dias=${encodeURIComponent(dias)}`);
    const msg=await r.text();
    document.getElementById('status').textContent=msg;
    if(msg.includes('creado')){document.getElementById('turnoNombre').value='';cargarTurnos();}
  }catch(e){document.getElementById('status').textContent='Error: '+e.message;}
}
renderDias();cargarTurnos();setInterval(cargarTurnos,15000);
</script>
</body>
</html>
