<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Registro de Asistencias</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0f14;--surface:#141720;--surface2:#1a1e2b;--border:#252a3a;--accent:#00e5a0;--accent2:#3d8ef8;--warn:#f59e0b;--danger:#ef4444;--text:#e2e8f0;--dim:#6b7a99;--r:4px}
body{font-family:'Courier New',Courier,monospace;background:var(--bg);color:var(--text);min-height:100vh;padding:12px}
.wrap{max-width:600px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:14px 0 10px;border-bottom:1px solid var(--border);margin-bottom:14px}
.back{background:none;border:1px solid var(--border);color:var(--dim);padding:5px 10px;border-radius:var(--r);font-family:inherit;font-size:11px;cursor:pointer;letter-spacing:1px}
.back:hover{color:var(--text);border-color:var(--dim)}
h1{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);flex:1;text-align:center}
.total-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.total-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.total-num{font-size:20px;font-weight:700;color:var(--accent)}
.item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.item.salida{border-left:3px solid var(--warn)}
.item.entrada{border-left:3px solid var(--accent)}
.badge{display:inline-block;padding:3px 8px;border-radius:var(--r);font-size:9px;font-weight:700;letter-spacing:1px;flex-shrink:0}
.badge-entrada{background:rgba(0,229,160,.15);color:var(--accent);border:1px solid var(--accent)}
.badge-salida{background:rgba(245,158,11,.15);color:var(--warn);border:1px solid var(--warn)}
.item-body{flex:1}
.item-nombre{font-size:13px;font-weight:700;color:var(--text)}
.item-info{font-size:10px;color:var(--dim);margin-top:2px}
.empty{text-align:center;padding:40px;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" onclick="window.location.href='/'">← VOLVER</button>
    <h1>Registro de Asistencias</h1>
  </header>

  <div class="total-bar">
    <div class="total-label">Total registros</div>
    <div class="total-num" id="totalNum">0</div>
  </div>

  <div id="lista"><div class="empty">Cargando...</div></div>
</div>

<script>
async function cargar(){
  try{
    const asistencias=await fetch('/api/asistencias').then(r=>r.json());
    document.getElementById('totalNum').textContent=asistencias.length;
    const lista=document.getElementById('lista');
    if(!asistencias.length){lista.innerHTML='<div class="empty">No hay asistencias registradas</div>';return;}
    lista.innerHTML=[...asistencias].reverse().map(a=>`
      <div class="item ${a.tipo}">
        <div class="badge badge-${a.tipo}">${a.tipo.toUpperCase()}</div>
        <div class="item-body">
          <div class="item-nombre">${a.nombre}</div>
          <div class="item-info">${a.timestamp} &nbsp;|&nbsp; ID: ${a.persona_id}</div>
        </div>
      </div>`).join('');
  }catch(e){document.getElementById('lista').innerHTML='<div class="empty">Error cargando datos</div>';}
}
cargar();setInterval(cargar,10000);
</script>
</body>
</html>
