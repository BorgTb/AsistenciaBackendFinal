<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Configuración de Red y Servidores</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{background:white;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.3);padding:30px;max-width:450px;width:100%}
h1{color:#667eea;text-align:center;margin-bottom:20px;font-size:24px}
.form-group{margin-bottom:15px}
label{display:block;color:#333;font-weight:600;margin-bottom:5px;font-size:14px}
input{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:14px}
input:focus{outline:none;border-color:#667eea}
h3{color:#555;font-size:16px;margin:20px 0 10px;border-bottom:2px solid #eee;padding-bottom:5px}
button{width:100%;padding:14px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px;color:white;background:#667eea}
button:hover{background:#5568c0}
.btn-secondary{background:#6c757d;margin-top:5px}
.btn-secondary:hover{background:#5a6268}
.status{margin-top:15px;padding:12px;border-radius:8px;text-align:center;display:none}
.status.show{display:block}
.status.success{background:#d4edda;color:#155724}
.status.error{background:#f8d7da;color:#721c24}
</style>
</head>
<body>
<div class="container">
<h1>Configuración del Dispositivo</h1>
<form id="wifiForm">
    
    <h3>Conexión Wi-Fi</h3>
    <div class="form-group">
        <label>SSID (Nombre de la Red)</label>
        <input type="text" id="ssid" placeholder="Ej: MiRedWiFi" required>
    </div>
    <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="********" required>
    </div>

    <h3>Servidores (Opcional)</h3>
    <div class="form-group">
        <label>URL Backend HTTP</label>
        <input type="text" id="backend" placeholder="http://192.168.1.X:5000">
    </div>
    <div class="form-group">
        <label>IP Broker MQTT</label>
        <input type="text" id="mqtt" placeholder="Ej: 192.168.1.X">
    </div>

    <button type="submit">Guardar y Reiniciar</button>
    <button type="button" class="btn-secondary" onclick="window.location.href='/'">Volver</button>
</form>
<div id="status" class="status"></div>
</div>

<script>
// Cargar valores actuales al abrir la página
fetch('/estado').then(r => r.json()).then(data => {
    if(data.backend) document.getElementById('backend').value = data.backend;
    if(data.mqtt) document.getElementById('mqtt').value = data.mqtt;
});

document.getElementById('wifiForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const ssid = document.getElementById('ssid').value.trim();
    const pass = document.getElementById('password').value.trim();
    const backend = document.getElementById('backend').value.trim();
    const mqtt = document.getElementById('mqtt').value.trim();
    const status = document.getElementById('status');
    
    try {
        const url = `/wifi-config?ssid=${encodeURIComponent(ssid)}&pass=${encodeURIComponent(pass)}&backend=${encodeURIComponent(backend)}&mqtt=${encodeURIComponent(mqtt)}`;
        const r = await fetch(url);
        const msg = await r.text();
        status.className = 'status show success';
        status.textContent = msg;
        setTimeout(() => location.href = '/', 3000);
    } catch (e) {
        status.className = 'status show error';
        status.textContent = 'Error: ' + e.message;
    }
});
</script>
</body>
</html>
