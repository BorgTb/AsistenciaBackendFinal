
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Personas Registradas</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:10px}
.container{background:white;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.3);padding:20px;max-width:800px;margin:0 auto}
h1{color:#333;text-align:center;margin-bottom:15px}
.item{background:#f5f5f5;padding:12px;margin:8px 0;border-left:4px solid #667eea;border-radius:6px}
.item-nombre{font-size:16px;font-weight:bold;color:#333;margin-bottom:4px}
.item-info{font-size:12px;color:#666}
button{width:100%;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;color:white;background:#667eea}
button:hover{background:#5568c0}
.btn-success{background:#4CAF50;margin-top:0;margin-bottom:15px}
.btn-success:hover{background:#45a049}
.empty{text-align:center;padding:40px;color:#999;font-style:italic}
</style>
</head>
<body>
<div class="container">
<h1>Personas Registradas</h1>
<button class="btn-success" onclick="window.location.href='/register'">Registrar Nueva Persona</button>
<div id="lista">Cargando...</div>
<button onclick="window.location.href='/gestion'">Volver</button>
</div>
<script>
async function cargar(){
try{
const r=await fetch('/api/personas');
const personas=await r.json();
const lista=document.getElementById('lista');
if(personas.length===0){
lista.innerHTML='<div class="empty">No hay personas registradas</div>';
return;
}
let html='';
window.cachePersonas = personas;
// ... dentro de cargar() en personas.html
personas.forEach((p, idx)=>{
html+=`<div class="item">
<div class="item-nombre">${p.nombre}</div>
<div class="item-info">RUT: ${p.rut || 'N/A'} | Email: ${p.email || 'N/A'}</div>
<div class="item-info">Huella ID: ${p.huella_id} | ID Sistema: ${p.id}</div>
<button style="background:#ff9800; margin-top:8px;" onclick="editarPersona(${idx})">Editar Nombre/Email</button>
<button style="background:#795548; margin-top:8px;" onclick="actualizarHuella(${idx})">Actualizar Huella</button>
<button style="background:#009688; margin-top:8px;" onclick="actualizarRostro(${idx})">Actualizar Rostro</button>
<button style="background:#f44336; margin-top:8px;" onclick="borrarPersona('${p.id}')">Eliminar Trabajador</button>
</div>`;
});
lista.innerHTML=html;
}catch(e){
document.getElementById('lista').innerHTML='<div class="empty">Error cargando datos</div>';
}
}
// Añade esta función afuera de cargar()
async function borrarPersona(id) {
    if(!confirm('¿ESTÁ SEGURO? Se borrará el registro y la huella del reloj local.')) return;
    try {
        const r = await fetch('/borrar_persona?id=' + encodeURIComponent(id));
        const msg = await r.text();
        alert(msg);
        cargar(); // Recarga la lista automáticamente
    } catch(e) {
        alert('Error al borrar');
    }
}

async function editarPersona(idx) {
    const p = window.cachePersonas[idx];
    if(!p) return;
    const nuevoNombre = prompt('Nuevo nombre:', p.nombre || '');
    if(nuevoNombre === null) return;
    const nombre = nuevoNombre.trim();
    if(!nombre) { alert('Nombre invalido'); return; }
    const nuevoEmail = prompt('Nuevo email (opcional):', p.email || '');
    if(nuevoEmail === null) return;

    try {
        const r = await fetch('/editar_persona?id=' + encodeURIComponent(p.id) + '&name=' + encodeURIComponent(nombre) + '&email=' + encodeURIComponent(nuevoEmail.trim()));
        const msg = await r.text();
        alert(msg);
        cargar();
    } catch(e) {
        alert('Error al editar: ' + e.message);
    }
}

async function actualizarHuella(idx) {
    const p = window.cachePersonas[idx];
    if(!p) return;
    if(!confirm('Se actualizara la huella de ' + p.nombre + '.\n\nDeberas poner el dedo 2 veces en el sensor.')) return;
    try {
        const r = await fetch('/actualizar_huella?id=' + encodeURIComponent(p.id));
        const msg = await r.text();
        alert(msg);
        cargar();
    } catch(e) {
        alert('Error al actualizar huella: ' + e.message);
    }
}

async function actualizarRostro(idx) {
    const p = window.cachePersonas[idx];
    if(!p) return;
    if(!confirm('Se capturara una nueva foto facial para ' + p.nombre + '.')) return;
    try {
        const r = await fetch('/actualizar_rostro?id=' + encodeURIComponent(p.id));
        const msg = await r.text();
        alert(msg);
    } catch(e) {
        alert('Error al actualizar rostro: ' + e.message);
    }
}
cargar();
setInterval(cargar,10000);
</script>
</body>
</html>
