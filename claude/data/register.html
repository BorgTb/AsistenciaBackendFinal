<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Registro Biométrico Híbrido</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#2b5876 0%,#4e4376 100%);min-height:100vh;padding:20px}
.container{background:white;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.3);padding:30px;max-width:900px;margin:0 auto}
h1{color:#333;text-align:center;margin-bottom:20px;font-size:24px}
.content{display:flex;gap:20px;flex-wrap:wrap}
.form-section{flex:1;min-width:300px}
.monitor-section{flex:1;min-width:300px;background:#1e1e1e;border-radius:10px;padding:20px;display:flex;flex-direction:column}
.form-group{margin-bottom:15px}
label{display:block;color:#333;font-weight:600;margin-bottom:5px;font-size:14px}
input{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:14px}
input:focus{outline:none;border-color:#4e4376}
button{width:100%;padding:14px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px;color:white;transition:0.3s}
button:hover{transform:scale(1.02)}
.btn-success{background:#4CAF50}
.btn-info{background:#00bcd4}
.btn-secondary{background:#6c757d}
.terminal{flex-grow:1;background:#000;color:#0f0;font-family:monospace;font-size:13px;padding:15px;border-radius:8px;overflow-y:auto;height:300px;margin-top:10px;border:1px solid #333}
.instrucciones{background:#e3f2fd;border-left:4px solid #2196f3;padding:15px;margin-bottom:20px;font-size:14px;border-radius:4px}
</style>
</head>
<body>
<div class="container">
    <h1>Registro de Personal</h1>
    
    <div class="instrucciones">
        <strong>Paso a paso:</strong><br>
        1. Ingrese los datos y haga clic en "Iniciar Registro".<br>
        2. El usuario debe colocar su huella <b>2 veces</b> en el sensor.<br>
        3. Al terminar la huella, el usuario debe <b>mirar la cámara del reloj</b> por 3 segundos.
    </div>

    <div class="content">
        <div class="form-section">
            <div class="form-group">
                <label>Nombre Completo *</label>
                <input type="text" id="personName" placeholder="Ej: Juan Perez" required>
            </div>
            <div class="form-group">
                <label>RUT *</label>
                <input type="text" id="personRut" placeholder="Ej: 12345678-9" required>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="personEmail" placeholder="Ej: juan@email.com" required>
            </div>
            
            <button class="btn-success" onclick="iniciarRegistro()">Iniciar Registro</button>
            <button class="btn-info" onclick="window.location.href='/personas'">Ver Personas</button>
            <button class="btn-secondary" onclick="window.location.href='/'">Volver al Inicio</button>
        </div>
        
        <div class="monitor-section">
            <h3 style="color:#fff;text-align:center;">Monitor del Dispositivo</h3>
            <div class="terminal" id="logViewer">Cargando conexión con el hardware...</div>
        </div>
    </div>
</div>

<script>
// Refresca la terminal cada 1.5 segundos leyendo los logs reales del ESP32
setInterval(async () => {
    try {
        const response = await fetch('/logs');
        if (response.ok) {
            const htmlText = await response.text();
            // Extraer solo el contenido del log usando una expresión regular
            const match = htmlText.match(/<div style='font-family:monospace;font-size:12px'>([\s\S]*?)<\/div>/);
            const terminal = document.getElementById('logViewer');
            if (match && match[1]) {
                terminal.innerHTML = match[1];
                terminal.scrollTop = terminal.scrollHeight; // Autoscroll
            }
        }
    } catch (e) {
        console.error("Error leyendo logs");
    }
}, 1500);

async function iniciarRegistro() {
    const nombre = document.getElementById('personName').value.trim();
    const rut = document.getElementById('personRut').value.trim();
    const email = document.getElementById('personEmail').value.trim();
    
    if(!nombre || !rut || !email) {
        alert('Por favor complete todos los campos');
        return;
    }

    try {
        const r = await fetch('/registrar?name=' + encodeURIComponent(nombre) + '&rut=' + encodeURIComponent(rut) + '&email=' + encodeURIComponent(email));
        if(r.ok) {
            document.getElementById('personName').value = '';
            document.getElementById('personRut').value = '';
            document.getElementById('personEmail').value = '';
            alert("Proceso iniciado. Por favor, mire la terminal negra a la derecha y siga las instrucciones del hardware.");
        } else {
            const msg = await r.text();
            alert("Error: " + msg);
        }
    } catch(e) {
        alert('Error de conexión con el ESP32: ' + e.message);
    }
}
</script>
</body>
</html>
