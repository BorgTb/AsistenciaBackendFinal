<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Registro Biométrico</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#1e3c72 0%,#2a5298 100%);min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center}
.container{background:white;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.3);padding:30px;max-width:500px;width:100%}
h1{color:#333;text-align:center;margin-bottom:20px;font-size:24px}
.form-group{margin-bottom:15px}
label{display:block;color:#333;font-weight:600;margin-bottom:5px;font-size:14px}
input{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:14px;transition:0.3s}
input:focus{outline:none;border-color:#2a5298}
button{width:100%;padding:14px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px;color:white;transition:0.3s}
button:hover{transform:scale(1.02)}
.btn-success{background:#4CAF50}
.btn-secondary{background:#6c757d}

/* --- ESTILOS DEL STEPPER BIOMÉTRICO --- */
#biometric-process{display:none;text-align:center}
.step-box{background:#f9f9f9;border:2px solid #eee;border-radius:10px;padding:20px;margin-bottom:15px;opacity:0.4;transition:0.5s}
.step-box.active{opacity:1;border-color:#2a5298;background:#e3f2fd;transform:scale(1.05);box-shadow:0 5px 15px rgba(42,82,152,0.2)}
.step-box.done{opacity:1;border-color:#4CAF50;background:#e8f5e9}
.step-icon{font-size:40px;margin-bottom:10px}
.step-title{font-weight:bold;color:#333;font-size:16px}
.camera-flash{animation: flash 1s infinite alternate;}
@keyframes flash {
    0% { color: #333; text-shadow: none; }
    100% { color: #ffeb3b; text-shadow: 0 0 20px #ffeb3b; }
}
</style>
</head>
<body>

<div class="container">
    <h1>Alta de Trabajador</h1>

    <div id="form-container">
        <div class="form-group">
            <label>Nombre Completo</label>
            <input type="text" id="personName" placeholder="Ej: Juan Perez" required>
        </div>
        <div class="form-group">
            <label>RUT</label>
            <input type="text" id="personRut" placeholder="Ej: 12345678-9" required>
        </div>
        <div class="form-group">
            <label>Email Corporativo</label>
            <input type="email" id="personEmail" placeholder="Ej: juan@empresa.com" required>
        </div>
        
        <button class="btn-success" onclick="iniciarRegistro()">Iniciar Escaneo</button>
        <button class="btn-secondary" onclick="window.location.href='/'">Cancelar</button>
    </div>

    <div id="biometric-process">
        <div class="step-box" id="step1">
            <div class="step-icon">👆</div>
            <div class="step-title">1. Coloque el dedo en el sensor</div>
            <small>Mantenga presionado firmemente</small>
        </div>

        <div class="step-box" id="step2">
            <div class="step-icon">👆</div>
            <div class="step-title">2. Levante y vuelva a colocarlo</div>
            <small>Para confirmar la plantilla biométrica</small>
        </div>

        <div class="step-box" id="step3">
            <div class="step-icon" id="camIcon">📸</div>
            <img id="camPreview" src="" style="display:none; width:100%; max-width:240px; border-radius:8px; margin:10px auto; border:3px solid #2a5298;">
            
            <div class="step-title" id="step3-title">3. Mire a la cámara del Reloj</div>
            <small id="step3-desc">Se registrará su rostro en la Base de Datos</small>
        </div>

        <button class="btn-success" id="btn-finish" style="display:none;" onclick="window.location.reload()">Registrar a otra persona</button>
        <button class="btn-secondary" onclick="window.location.href='/'">Volver al Inicio</button>
    </div>

</div>

<script>
let checkInterval;
let previewInterval; // NUEVO: Para controlar el polling de la foto
let stepActual = 0;

async function iniciarRegistro() {
    const nombre = document.getElementById('personName').value.trim();
    const rut = document.getElementById('personRut').value.trim();
    const email = document.getElementById('personEmail').value.trim();
    
    if(!nombre || !rut || !email) {
        alert('Por favor complete todos los datos antes de continuar.');
        return;
    }

    try {
        const r = await fetch('/registrar?name=' + encodeURIComponent(nombre) + '&rut=' + encodeURIComponent(rut) + '&email=' + encodeURIComponent(email));
        if(r.ok) {
            // Ocultar form y mostrar UI biométrica
            document.getElementById('form-container').style.display = 'none';
            document.getElementById('biometric-process').style.display = 'block';
            
            // Iniciar motor de pasos
            marcarPasoActivo(1);
            checkInterval = setInterval(monitorearHardware, 800);
        } else {
            const msg = await r.text();
            alert("Error: " + msg);
        }
    } catch(e) {
        alert('Error conectando con el reloj.');
    }
}

async function monitorearHardware() {
    try {
        const r = await fetch('/estado');
        const data = await r.json();
        
        if (stepActual === 1 && data.codigo_paso === 2) {
            marcarPasoActivo(2);
        } 
        else if (stepActual === 2 && data.codigo_paso === 0) {
            marcarExito();
        }
    } catch(e) {
        // El ESP32 se bloquea al tomar la primera foto, disparamos el Paso 3
        if (stepActual === 2) {
            marcarPasoActivo(3);
            // Iniciamos la búsqueda de la imagen cada 1.5 segundos
            previewInterval = setInterval(obtenerVistaPrevia, 1500); 
        }
    }
}
async function obtenerVistaPrevia() {
    try {
        const r = await fetch('/ultimo_registro');
        if (r.ok) {
            const data = await r.json();
            // Si el JSON trae una URL válida de Flask
            if (data.imagen_url && data.imagen_url.startsWith("http")) {
                const img = document.getElementById('camPreview');
                const icon = document.getElementById('camIcon');
                
                icon.style.display = 'none'; // Ocultamos el emoji
                img.style.display = 'block'; // Mostramos la foto
                
                // Truco para evitar que el navegador guarde la foto vieja en caché
                img.src = data.imagen_url + "?t=" + new Date().getTime();
            }
        }
    } catch(e) {
        console.log("Esperando imagen...");
    }
}
function marcarPasoActivo(paso) {
    stepActual = paso;
    
    document.getElementById('step1').className = 'step-box';
    document.getElementById('step2').className = 'step-box';
    document.getElementById('step3').className = 'step-box';
    document.getElementById('camIcon').classList.remove('camera-flash');

    if(paso === 1) {
        document.getElementById('step1').classList.add('active');
    }
    else if(paso === 2) {
        document.getElementById('step1').classList.add('done');
        document.getElementById('step2').classList.add('active');
    }
    else if(paso === 3) {
        document.getElementById('step1').classList.add('done');
        document.getElementById('step2').classList.add('done');
        document.getElementById('step3').classList.add('active');
        document.getElementById('camIcon').classList.add('camera-flash');
    }
}

function marcarExito() {
    clearInterval(checkInterval);
    if(previewInterval) clearInterval(previewInterval); // Detenemos la búsqueda de fotos
    
    document.getElementById('step1').className = 'step-box done';
    document.getElementById('step2').className = 'step-box done';
    document.getElementById('step3').className = 'step-box done';
    document.getElementById('camIcon').style.display = 'block'; // Volvemos a mostrar el emoji
    document.getElementById('camPreview').style.display = 'none'; // Ocultamos la foto final
    document.getElementById('camIcon').classList.remove('camera-flash');
    
    document.getElementById('step3-title').innerText = "¡Registro Completo!";
    document.getElementById('step3-desc').innerText = "Rostro y huellas sincronizados.";
    document.getElementById('btn-finish').style.display = 'block';
}
</script>
</body>
</html>
