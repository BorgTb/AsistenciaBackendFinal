<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Logs del Sistema</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0f14;--surface:#141720;--surface2:#1a1e2b;--border:#252a3a;--accent:#00e5a0;--accent2:#3d8ef8;--warn:#f59e0b;--danger:#ef4444;--text:#e2e8f0;--dim:#6b7a99;--r:4px}
body{font-family:'Courier New',Courier,monospace;background:var(--bg);color:var(--text);min-height:100vh;padding:12px;display:flex;flex-direction:column}
.wrap{max-width:800px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:14px 0 10px;border-bottom:1px solid var(--border);margin-bottom:10px;flex-shrink:0}
.back{background:none;border:1px solid var(--border);color:var(--dim);padding:5px 10px;border-radius:var(--r);font-family:inherit;font-size:11px;cursor:pointer;letter-spacing:1px}
.back:hover{color:var(--text);border-color:var(--dim)}
h1{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);flex:1;text-align:center}
.toolbar{display:flex;gap:6px;margin-bottom:8px;flex-shrink:0}
.tbtn{flex:1;padding:8px;border:1px solid var(--border);border-radius:var(--r);font-family:inherit;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;background:var(--surface);color:var(--dim);transition:.15s}
.tbtn:hover{color:var(--text);border-color:var(--dim)}
.tbtn-ok:hover{border-color:var(--accent);color:var(--accent)}
.tbtn-del:hover{border-color:var(--danger);color:var(--danger)}
.logbox{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px;overflow-y:auto;min-height:300px;max-height:calc(100vh - 160px);font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all;color:#b0c4de}
.logbox::-webkit-scrollbar{width:4px}.logbox::-webkit-scrollbar-track{background:var(--surface)}.logbox::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.statusbar{font-size:9px;color:var(--dim);letter-spacing:1px;padding:5px 2px;flex-shrink:0}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-right:5px;vertical-align:middle;animation:blink 1.5s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" onclick="window.location.href='/'">← VOLVER</button>
    <h1>Logs del Sistema</h1>
  </header>
  <div class="toolbar">
    <button class="tbtn tbtn-ok" onclick="cargarLogs()">↺ ACTUALIZAR</button>
    <button class="tbtn tbtn-del" onclick="limpiarLogs()">✕ LIMPIAR</button>
  </div>
  <div id="logs" class="logbox">Cargando logs...</div>
  <div id="status" class="statusbar"><span class="dot"></span>AUTO-REFRESH CADA 2s</div>
</div>

<script>
async function cargarLogs(){
  try{
    const html=await fetch('/api/logs').then(r=>r.text());
    const box=document.getElementById('logs');
    box.innerHTML=html||'Sin logs disponibles';
    box.scrollTop=box.scrollHeight;
    document.getElementById('status').innerHTML='<span class="dot"></span>ACTUALIZADO: '+new Date().toLocaleTimeString();
  }catch(e){document.getElementById('status').textContent='Error: '+e.message;}
}
async function limpiarLogs(){
  if(!confirm('¿Limpiar buffer de logs?'))return;
  try{
    const msg=await fetch('/api/logs/clear').then(r=>r.text());
    document.getElementById('status').textContent=msg;
    cargarLogs();
  }catch(e){document.getElementById('status').textContent='Error: '+e.message;}
}
cargarLogs();setInterval(cargarLogs,2000);
</script>
</body>
</html>
