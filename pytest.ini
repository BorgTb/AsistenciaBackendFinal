[pytest]
testpaths = Backend/tests
pythonpath = Backend
; No usamos DJANGO_SETTINGS, solo Flask
; Coverage settings
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (requires PostgreSQL Docker)
    slow: Slow tests (facial recognition, etc.)
    e2e: End-to-end ESP32 emulation tests
