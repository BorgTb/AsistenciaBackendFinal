<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Turnos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .tab {
            padding: 15px 30px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }
        
        .tab:hover {
            color: #667eea;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
        
        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        tr:hover {
            background: #f5f5f5;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: #4CAF50;
            color: white;
        }
        
        .btn-success:hover {
            background: #45a049;
        }
        
        .btn-danger {
            background: #f44336;
            color: white;
        }
        
        .btn-danger:hover {
            background: #da190b;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }
        
        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge-success {
            background: #d4edda;
            color: #155724;
        }
        
        .badge-info {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #999;
        }
        
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Sistema de Gestión de Turnos</h1>
        <p class="subtitle">Control de personal y asignación de horarios</p>
        
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalPersonas">-</div>
                <div class="stat-label">Personas Registradas</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalTurnos">-</div>
                <div class="stat-label">Turnos Disponibles</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalAsignaciones">-</div>
                <div class="stat-label">Asignaciones Activas</div>
            </div>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('personas')">👥 Personas</button>
            <button class="tab" onclick="switchTab('turnos')">🕐 Turnos</button>
            <button class="tab" onclick="switchTab('asignaciones')">📋 Asignaciones</button>
            <button class="tab" onclick="switchTab('nueva-asignacion')">➕ Nueva Asignación</button>
        </div>
        
        <!-- Tab Personas -->
        <div id="tab-personas" class="tab-content active">
            <div class="card">
                <h3>👥 Listado de Personas Registradas</h3>
                <button class="btn btn-primary" onclick="loadPersonas()">🔄 Actualizar</button>
                <div id="personasContent" class="loading">Cargando...</div>
            </div>
        </div>
        
        <!-- Tab Turnos -->
        <div id="tab-turnos" class="tab-content">
            <div class="card">
                <h3>🕐 Turnos Disponibles</h3>
                <button class="btn btn-primary" onclick="loadTurnos()">🔄 Actualizar</button>
                <div id="turnosContent" class="loading">Cargando...</div>
            </div>
        </div>
        
        <!-- Tab Asignaciones -->
        <div id="tab-asignaciones" class="tab-content">
            <div class="card">
                <h3>📋 Asignaciones de Turnos</h3>
                <button class="btn btn-primary" onclick="loadAsignaciones()">🔄 Actualizar</button>
                <div id="asignacionesContent" class="loading">Cargando...</div>
            </div>
        </div>
        
        <!-- Tab Nueva Asignación -->
        <div id="tab-nueva-asignacion" class="tab-content">
            <div class="card">
                <h3>➕ Asignar Turno a Persona</h3>
                <div id="statusMessage"></div>
                <form id="asignacionForm" onsubmit="crearAsignacion(event)">
                    <div class="form-group">
                        <label for="selectPersona">Seleccionar Persona:</label>
                        <select id="selectPersona" required>
                            <option value="">Cargando...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="selectTurno">Seleccionar Turno:</label>
                        <select id="selectTurno" required>
                            <option value="">Cargando...</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success">✅ Asignar Turno</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        
        // Cargar estadísticas al iniciar
        loadStats();
        loadPersonas();
        loadSelectOptions();
        
        function switchTab(tabName) {
            // Remover clase active de todos
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            // Activar tab seleccionado
            event.target.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            // Cargar datos del tab
            if (tabName === 'personas') loadPersonas();
            if (tabName === 'turnos') loadTurnos();
            if (tabName === 'asignaciones') loadAsignaciones();
        }
        
        async function loadStats() {
            try {
                const personas = await fetch(`${API_URL}/personas`).then(r => r.json());
                const turnos = await fetch(`${API_URL}/turnos`).then(r => r.json());
                const asignaciones = await fetch(`${API_URL}/asignaciones`).then(r => r.json());
                
                document.getElementById('totalPersonas').textContent = personas.total || 0;
                document.getElementById('totalTurnos').textContent = turnos.total || 0;
                document.getElementById('totalAsignaciones').textContent = asignaciones.total || 0;
            } catch (error) {
                console.error('Error cargando estadísticas:', error);
            }
        }
        
        async function loadPersonas() {
            const content = document.getElementById('personasContent');
            content.innerHTML = '<div class="loading">Cargando...</div>';
            
            try {
                const response = await fetch(`${API_URL}/personas`);
                const data = await response.json();
                
                if (data.success && data.personas.length > 0) {
                    let html = '<table><thead><tr><th>ID</th><th>Nombre</th><th>Fecha Registro</th><th>Total Imágenes</th><th>Acciones</th></tr></thead><tbody>';
                    
                    for (const persona of data.personas) {
                        html += `
                            <tr>
                                <td>${persona.id}</td>
                                <td><strong>${persona.nombre}</strong></td>
                                <td>${persona.fecha_registro}</td>
                                <td><span class="badge badge-info">${persona.total_imagenes} imágenes</span></td>
                                <td><button class="btn btn-primary" onclick="verDetallePersona('${persona.id}')">📄 Ver Turnos</button></td>
                            </tr>
                        `;
                    }
                    
                    html += '</tbody></table>';
                    content.innerHTML = html;
                } else {
                    content.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><p>No hay personas registradas aún</p></div>';
                }
            } catch (error) {
                content.innerHTML = '<div class="status-error">❌ Error cargando personas: ' + error.message + '</div>';
            }
        }
        
        async function loadTurnos() {
            const content = document.getElementById('turnosContent');
            content.innerHTML = '<div class="loading">Cargando...</div>';
            
            try {
                const response = await fetch(`${API_URL}/turnos`);
                const data = await response.json();
                
                if (data.success && data.turnos.length > 0) {
                    let html = '<table><thead><tr><th>ID</th><th>Nombre Turno</th><th>Hora Inicio</th><th>Hora Fin</th><th>Días</th></tr></thead><tbody>';
                    
                    data.turnos.forEach(turno => {
                        html += `
                            <tr>
                                <td>${turno.id}</td>
                                <td><strong>${turno.nombre_turno}</strong></td>
                                <td>${turno.hora_inicio}</td>
                                <td>${turno.hora_fin}</td>
                                <td><span class="badge badge-success">${turno.dias_semana}</span></td>
                            </tr>
                        `;
                    });
                    
                    html += '</tbody></table>';
                    content.innerHTML = html;
                } else {
                    content.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🕐</div><p>No hay turnos disponibles</p></div>';
                }
            } catch (error) {
                content.innerHTML = '<div class="status-error">❌ Error cargando turnos: ' + error.message + '</div>';
            }
        }
        
        async function loadAsignaciones() {
            const content = document.getElementById('asignacionesContent');
            content.innerHTML = '<div class="loading">Cargando...</div>';
            
            try {
                const response = await fetch(`${API_URL}/asignaciones`);
                const data = await response.json();
                
                if (data.success && data.asignaciones.length > 0) {
                    let html = '<table><thead><tr><th>Persona</th><th>Turno</th><th>Horario</th><th>Días</th><th>Fecha Asignación</th><th>Acciones</th></tr></thead><tbody>';
                    
                    data.asignaciones.forEach(asig => {
                        html += `
                            <tr>
                                <td><strong>${asig.persona.nombre}</strong></td>
                                <td>${asig.turno.nombre_turno}</td>
                                <td>${asig.turno.hora_inicio} - ${asig.turno.hora_fin}</td>
                                <td><span class="badge badge-success">${asig.turno.dias_semana}</span></td>
                                <td>${asig.fecha_asignacion}</td>
                                <td><button class="btn btn-danger" onclick="eliminarAsignacion('${asig.persona.id}', '${asig.turno.id}')">🗑️ Eliminar</button></td>
                            </tr>
                        `;
                    });
                    
                    html += '</tbody></table>';
                    content.innerHTML = html;
                } else {
                    content.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><p>No hay asignaciones creadas aún</p></div>';
                }
            } catch (error) {
                content.innerHTML = '<div class="status-error">❌ Error cargando asignaciones: ' + error.message + '</div>';
            }
        }
        
        async function loadSelectOptions() {
            try {
                // Cargar personas
                const personasResponse = await fetch(`${API_URL}/personas`);
                const personasData = await personasResponse.json();
                const selectPersona = document.getElementById('selectPersona');
                
                selectPersona.innerHTML = '<option value="">-- Seleccionar Persona --</option>';
                personasData.personas.forEach(p => {
                    selectPersona.innerHTML += `<option value="${p.id}">${p.nombre}</option>`;
                });
                
                // Cargar turnos
                const turnosResponse = await fetch(`${API_URL}/turnos`);
                const turnosData = await turnosResponse.json();
                const selectTurno = document.getElementById('selectTurno');
                
                selectTurno.innerHTML = '<option value="">-- Seleccionar Turno --</option>';
                turnosData.turnos.forEach(t => {
                    selectTurno.innerHTML += `<option value="${t.id}">${t.nombre_turno} (${t.hora_inicio} - ${t.hora_fin})</option>`;
                });
            } catch (error) {
                console.error('Error cargando opciones:', error);
            }
        }
        
        async function crearAsignacion(event) {
            event.preventDefault();
            
            const personaId = document.getElementById('selectPersona').value;
            const turnoId = document.getElementById('selectTurno').value;
            const statusMessage = document.getElementById('statusMessage');
            
            try {
                const response = await fetch(`${API_URL}/asignaciones`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        persona_id: personaId,
                        turno_id: turnoId
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    statusMessage.innerHTML = '<div class="status-success">✅ ' + data.message + '</div>';
                    document.getElementById('asignacionForm').reset();
                    loadStats();
                    setTimeout(() => statusMessage.innerHTML = '', 3000);
                } else {
                    statusMessage.innerHTML = '<div class="status-error">❌ ' + data.error + '</div>';
                }
            } catch (error) {
                statusMessage.innerHTML = '<div class="status-error">❌ Error: ' + error.message + '</div>';
            }
        }
        
        async function eliminarAsignacion(personaId, turnoId) {
            if (!confirm('¿Estás seguro de eliminar esta asignación?')) return;
            
            try {
                const response = await fetch(`${API_URL}/asignaciones/${personaId}/${turnoId}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('✅ ' + data.message);
                    loadAsignaciones();
                    loadStats();
                } else {
                    alert('❌ ' + data.error);
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }
        
        async function verDetallePersona(personaId) {
            try {
                const response = await fetch(`${API_URL}/personas/${personaId}`);
                const data = await response.json();
                
                if (data.success) {
                    const persona = data.persona;
                    let mensaje = `📋 Detalles de ${persona.nombre}\n\n`;
                    mensaje += `ID: ${persona.id}\n`;
                    mensaje += `Fecha registro: ${persona.fecha_registro}\n`;
                    mensaje += `Total imágenes: ${persona.total_imagenes}\n\n`;
                    
                    if (persona.turnos && persona.turnos.length > 0) {
                        mensaje += '🕐 Turnos asignados:\n';
                        persona.turnos.forEach(t => {
                            mensaje += `\n- ${t.nombre_turno}`;
                            mensaje += `\n  Horario: ${t.hora_inicio} - ${t.hora_fin}`;
                            mensaje += `\n  Días: ${t.dias_semana}`;
                        });
                    } else {
                        mensaje += '⚠️ No tiene turnos asignados';
                    }
                    
                    alert(mensaje);
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
