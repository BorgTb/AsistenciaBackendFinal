<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Registro de Asistencias</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--s:#1e293b;--s2:#334155;--b:#475569;--a:#3b82f6;--g:#22c55e;--w:#f59e0b;--d:#ef4444;--t:#f1f5f9;--dim:#94a3b8;--r:8px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;font-size:14px}
.wrap{max-width:540px;margin:0 auto;padding:16px 12px}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.back{background:var(--s);border:1px solid var(--b);color:var(--t);padding:7px 14px;border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.back:hover{background:var(--s2)}
h1{font-size:15px;font-weight:600;flex:1;text-align:center}
.total{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.total-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.total-num{font-size:24px;font-weight:700;color:var(--g)}
.item{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.item.e{border-left:3px solid var(--g)}.item.s{border-left:3px solid var(--w)}
.badge{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
.be{background:rgba(34,197,94,.12);color:var(--g)}.bs{background:rgba(245,158,11,.12);color:var(--w)}
.body{flex:1}
.nombre{font-size:13px;font-weight:600}
.info{font-size:10px;color:var(--dim);margin-top:2px}
.empty{text-align:center;padding:50px 20px;color:var(--dim);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" onclick="location.href='/'">← Volver</button>
    <h1>Registro de Asistencia</h1>
  </header>

  <div class="total">
    <span class="total-label">Total Registros</span>
    <span class="total-num" id="totalNum">0</span>
  </div>

  <div id="lista"><div class="empty">Cargando...</div></div>
</div>

<script>
async function cargar(){
  try{
    const asistencias=await fetch('/api/asistencias').then(r=>r.json());
    document.getElementById('totalNum').textContent=asistencias.length;
    const lista=document.getElementById('lista');
    if(!asistencias.length){lista.innerHTML='<div class="empty">No hay asistencias registradas</div>';return;}
    lista.innerHTML=[...asistencias].reverse().map(a=>`
      <div class="item ${a.tipo==='entrada'?'e':'s'}">
        <div class="badge ${a.tipo==='entrada'?'be':'bs'}">${a.tipo}</div>
        <div class="body">
          <div class="nombre">${a.nombre}</div>
          <div class="info">${a.timestamp} &nbsp;|&nbsp; ID: ${a.persona_id}</div>
        </div>
      </div>`).join('');
  }catch(e){document.getElementById('lista').innerHTML='<div class="empty">Error cargando datos</div>';}
}
cargar();setInterval(cargar,10000);
</script>
</body>
</html>
