<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Gestión de Turnos</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--s:#1e293b;--s2:#334155;--b:#475569;--a:#3b82f6;--g:#22c55e;--w:#f59e0b;--d:#ef4444;--t:#f1f5f9;--dim:#94a3b8;--r:8px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;font-size:14px}
.wrap{max-width:540px;margin:0 auto;padding:16px 12px}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back{background:var(--s);border:1px solid var(--b);color:var(--t);padding:7px 14px;border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.back:hover{background:var(--s2)}
h1{font-size:15px;font-weight:600;flex:1;text-align:center}
h2{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:14px 0 8px;padding-left:10px;border-left:3px solid var(--a)}
.form{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:16px;margin-bottom:14px}
label{display:block;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
input,select{width:100%;padding:10px 14px;background:var(--s2);border:1px solid var(--b);border-radius:6px;color:var(--t);font-family:inherit;font-size:13px;margin-bottom:10px;transition:.15s}
input:focus,select:focus{outline:none;border-color:var(--a)}
.trow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 10px}
.dia{padding:9px 0;border:1px solid var(--b);border-radius:4px;background:var(--s2);color:var(--dim);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;text-align:center;transition:.15s}
.dia:hover{border-color:var(--dim)}
.dia.on{background:var(--a);color:#fff;border-color:var(--a)}
.hint{font-size:10px;color:var(--dim);margin-bottom:10px}
.btn{width:100%;padding:11px;border:none;border-radius:6px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;background:var(--a);color:#fff;margin-bottom:6px;transition:.15s}
.btn:hover{background:#2563eb}
.btn-s{background:var(--s);border:1px solid var(--b);color:var(--dim)}.btn-s:hover{background:var(--s2);color:var(--t)}
.item{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:10px 14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item-info{flex:1}
.item-name{font-size:12px;font-weight:600;color:var(--t)}
.item-meta{font-size:10px;color:var(--dim);margin-top:2px}
.del-btn{background:none;border:1px solid var(--b);color:var(--dim);padding:5px 10px;border-radius:4px;font-family:inherit;font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s}
.del-btn:hover{border-color:var(--d);color:var(--d)}
.empty{text-align:center;padding:30px;color:var(--dim);font-size:12px}
.status{font-size:11px;color:var(--dim);text-align:center;padding:6px;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" onclick="location.href='/gestion'">← Volver</button>
    <h1>Gestión de Turnos</h1>
  </header>

  <h2>Crear Nuevo Turno</h2>
  <div class="form">
    <label>Nombre del Turno</label>
    <input type="text" id="turnoNombre" placeholder="Ej: Turno Mañana">
    <div class="trow">
      <div><label>Inicio</label><input type="time" id="turnoInicio" value="08:00"></div>
      <div><label>Fin</label><input type="time" id="turnoFin" value="16:00"></div>
    </div>
    <label>Días de la Semana</label>
    <div class="dgrid" id="diasPicker">
      <button class="dia on" data-dia="L" onclick="toggleDia(this)">L</button>
      <button class="dia on" data-dia="M" onclick="toggleDia(this)">M</button>
      <button class="dia on" data-dia="X" onclick="toggleDia(this)">X</button>
      <button class="dia on" data-dia="J" onclick="toggleDia(this)">J</button>
      <button class="dia on" data-dia="V" onclick="toggleDia(this)">V</button>
      <button class="dia" data-dia="S" onclick="toggleDia(this)">S</button>
      <button class="dia" data-dia="D" onclick="toggleDia(this)">D</button>
    </div>
    <div class="hint" id="diasPreview">Días: L, M, X, J, V</div>
    <button class="btn" onclick="crearTurno()">Crear Turno</button>
    <div class="status" id="status"></div>
  </div>

  <h2>Turnos Existentes</h2>
  <div id="listaTurnos"><div class="empty">Cargando...</div></div>

  <button class="btn btn-s" onclick="location.href='/gestion'">← Volver</button>
</div>

<script>
const ordenDias=['L','M','X','J','V','S','D'];
const selec=new Set(['L','M','X','J','V']);

function renderDias(){
  const dias=ordenDias.filter(d=>selec.has(d));
  document.getElementById('diasPreview').textContent='Días: '+(dias.length?dias.join(', '):'(ninguno)');
  document.querySelectorAll('.dia').forEach(b=>b.classList.toggle('on',selec.has(b.dataset.dia)));
}
function toggleDia(b){const d=b.dataset.dia;selec.has(d)?selec.delete(d):selec.add(d);renderDias();}

async function cargarTurnos(){
  try{
    const turnos=await fetch('/api/turnos').then(r=>r.json());
    const lista=document.getElementById('listaTurnos');
    if(!turnos.length){lista.innerHTML='<div class="empty">No hay turnos creados</div>';return;}
    lista.innerHTML=turnos.map(t=>`
      <div class="item">
        <div class="item-info">
          <div class="item-name">${t.nombre}</div>
          <div class="item-meta">${t.inicio} – ${t.fin} &nbsp;|&nbsp; ${t.dias} &nbsp;|&nbsp; ID: ${t.id}</div>
        </div>
        <button class="del-btn" onclick="borrarTurno('${t.id}')">Borrar</button>
      </div>`).join('');
  }catch(e){document.getElementById('listaTurnos').innerHTML='<div class="empty">Error</div>';}
}
async function borrarTurno(id){
  if(!confirm('¿Borrar este turno?'))return;
  try{alert(await fetch('/borrar_turno?id='+encodeURIComponent(id)).then(r=>r.text()));cargarTurnos();}
  catch(e){alert('Error al borrar');}
}
async function crearTurno(){
  const nombre=document.getElementById('turnoNombre').value;
  const inicio=document.getElementById('turnoInicio').value;
  const fin=document.getElementById('turnoFin').value;
  const dias=ordenDias.filter(d=>selec.has(d)).join(',');
  if(!nombre||!inicio||!fin){alert('Complete todos los campos');return;}
  if(!dias){alert('Seleccione al menos un día');return;}
  try{
    const r=await fetch(`/crear_turno?nombre=${encodeURIComponent(nombre)}&inicio=${inicio}&fin=${fin}&dias=${encodeURIComponent(dias)}`);
    const msg=await r.text();
    document.getElementById('status').textContent=msg;
    if(msg.includes('creado')){document.getElementById('turnoNombre').value='';cargarTurnos();}
  }catch(e){document.getElementById('status').textContent='Error: '+e.message;}
}
renderDias();cargarTurnos();setInterval(cargarTurnos,15000);
</script>
</body>
</html>
