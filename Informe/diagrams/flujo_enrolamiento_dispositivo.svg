<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1242px" preserveAspectRatio="none" style="width:854px;height:1242px;background:#FFFFFF;" version="1.1" viewBox="0 0 854 1242" width="854px" zoomAndPan="magnify"><title>Enrolamiento de dispositivo ESP32-CAM</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="28" font-weight="bold" lengthAdjust="spacing" textLength="542.9785" x="153.0205" y="69.0664">Enrolamiento de dispositivo ESP32-CAM</text><ellipse cx="474.2061" cy="117.2188" fill="#222222" rx="20" ry="20" style="stroke:#222222;stroke-width:2;"/><rect fill="#F5F9FF" height="130.5625" rx="25" ry="25" style="stroke:#2C5282;stroke-width:1;" width="488.2188" x="230.0967" y="177.2188"/><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="448.2188" x="250.0967" y="222.1328">Administrador genera PIN de 8 caracteres</text><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="206.8242" x="250.0967" y="252.3203">desde el panel web</text><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="386.8242" x="250.0967" y="282.5078">(POST /api/dispositivos/generar-pin)</text><rect fill="#F5F9FF" height="100.375" rx="25" ry="25" style="stroke:#2C5282;stroke-width:1;" width="369.4961" x="289.458" y="347.7813"/><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="329.4961" x="309.458" y="392.6953">Ingresar PIN en la interfaz web</text><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="286.8164" x="309.458" y="422.8828">embebida del ESP32-CAM</text><rect fill="#F5F9FF" height="100.375" rx="25" ry="25" style="stroke:#2C5282;stroke-width:1;" width="438.8125" x="254.7998" y="488.1563"/><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="398.8125" x="274.7998" y="533.0703">Dispositivo env&#237;a PIN y MAC address</text><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="116.0859" x="274.7998" y="563.2578">al backend</text><polygon fill="#F5F9FF" points="354.3608,628.5313,594.0513,628.5313,618.0513,652.5313,594.0513,676.5313,354.3608,676.5313,330.3608,652.5313,354.3608,628.5313" style="stroke:#2C5282;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="22" lengthAdjust="spacing" textLength="239.6904" x="354.3608" y="661.5332">&#191;PIN v&#225;lido y no usado?</text><text fill="#000000" font-family="sans-serif" font-size="22" lengthAdjust="spacing" textLength="17.1123" x="313.2485" y="647.6973">s&#237;</text><text fill="#000000" font-family="sans-serif" font-size="22" lengthAdjust="spacing" textLength="24.4707" x="618.0513" y="647.6973">no</text><rect fill="#C8E6C9" height="100.375" rx="25" ry="25" style="stroke:#2C5282;stroke-width:1;" width="478.9023" x="22" y="696.5313"/><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="358.8281" x="42" y="741.4453">Marcar dispositivo como enrolado</text><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="438.9023" x="42" y="771.6328">y asociarlo a la empresa correspondiente</text><rect fill="#F5F9FF" height="100.375" rx="25" ry="25" style="stroke:#2C5282;stroke-width:1;" width="356.1016" x="83.4004" y="836.9063"/><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="316.1016" x="103.4004" y="881.8203">Configurar credenciales Wi-Fi</text><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="288.1875" x="103.4004" y="912.0078">desde la interfaz embebida</text><rect fill="#C8E6C9" height="100.375" rx="25" ry="25" style="stroke:#2C5282;stroke-width:1;" width="334.8438" x="94.0293" y="977.2813"/><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="294.8438" x="114.0293" y="1022.1953">Dispositivo queda operativo</text><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="236.1563" x="114.0293" y="1052.3828">y conectado a internet</text><rect fill="#FFCDD2" height="100.375" rx="25" ry="25" style="stroke:#2C5282;stroke-width:1;" width="292.1172" x="540.9023" y="696.5313"/><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="248.1328" x="560.9023" y="741.4453">Rechazar enrolamiento</text><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="252.1172" x="560.9023" y="771.6328">y solicitar un nuevo PIN</text><polygon fill="#F5F9FF" points="474.2061,1089.6563,498.2061,1113.6563,474.2061,1137.6563,450.2061,1113.6563,474.2061,1089.6563" style="stroke:#2C5282;stroke-width:1;"/><ellipse cx="474.2061" cy="1199.6563" fill="none" rx="22" ry="22" style="stroke:#222222;stroke-width:2;"/><ellipse cx="474.2061" cy="1199.6563" fill="#222222" rx="12" ry="12" style="stroke:#222222;stroke-width:2;"/><line style="stroke:#181818;stroke-width:2;" x1="474.2061" x2="474.2061" y1="137.2188" y2="177.2188"/><polygon fill="#181818" points="466.2061,157.2188,474.2061,177.2188,482.2061,157.2188,474.2061,165.2188" style="stroke:#181818;stroke-width:2;"/><line style="stroke:#181818;stroke-width:2;" x1="474.2061" x2="474.2061" y1="307.7813" y2="347.7813"/><polygon fill="#181818" points="466.2061,327.7813,474.2061,347.7813,482.2061,327.7813,474.2061,335.7813" style="stroke:#181818;stroke-width:2;"/><line style="stroke:#181818;stroke-width:2;" x1="474.2061" x2="474.2061" y1="448.1563" y2="488.1563"/><polygon fill="#181818" points="466.2061,468.1563,474.2061,488.1563,482.2061,468.1563,474.2061,476.1563" style="stroke:#181818;stroke-width:2;"/><line style="stroke:#181818;stroke-width:2;" x1="261.4512" x2="261.4512" y1="796.9063" y2="836.9063"/><polygon fill="#181818" points="