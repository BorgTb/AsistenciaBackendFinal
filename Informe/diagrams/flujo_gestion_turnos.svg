<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="970px" preserveAspectRatio="none" style="width:788px;height:970px;background:#FFFFFF;" version="1.1" viewBox="0 0 788 970" width="788px" zoomAndPan="magnify"><title>Gesti&#243;n de turnos y asignaci&#243;n a personas</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="28" font-weight="bold" lengthAdjust="spacing" textLength="572.5918" x="105.5303" y="69.0664">Gesti&#243;n de turnos y asignaci&#243;n a personas</text><ellipse cx="360.4814" cy="117.2188" fill="#222222" rx="20" ry="20" style="stroke:#222222;stroke-width:2;"/><rect fill="#F5F9FF" height="130.5625" rx="25" ry="25" style="stroke:#2C5282;stroke-width:1;" width="340.1641" x="190.3994" y="177.2188"/><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="296.1445" x="210.3994" y="222.1328">Administrador crea un turno</text><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="300.1641" x="210.3994" y="252.3203">(horario de entrada y salida)</text><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="206.8242" x="210.3994" y="282.5078">desde el panel web</text><rect fill="#F5F9FF" height="100.375" rx="25" ry="25" style="stroke:#2C5282;stroke-width:1;" width="428.1602" x="146.4014" y="347.7813"/><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="388.1602" x="166.4014" y="392.6953">Seleccionar persona(s) registrada(s)</text><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="220.1367" x="166.4014" y="422.8828">para asignar el turno</text><polygon fill="#F5F9FF" points="227.7886,488.1563,493.1743,488.1563,517.1743,515.8281,493.1743,543.5,227.7886,543.5,203.7886,515.8281,227.7886,488.1563" style="stroke:#2C5282;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="22" lengthAdjust="spacing" textLength="265.3857" x="227.7886" y="510.9941">&#191;Persona ya tiene un turno</text><text fill="#000000" font-family="sans-serif" font-size="22" lengthAdjust="spacing" textLength="248.2949" x="227.7886" y="538.666">asignado en ese horario?</text><text fill="#000000" font-family="sans-serif" font-size="22" lengthAdjust="spacing" textLength="17.1123" x="186.6763" y="510.9941">s&#237;</text><text fill="#000000" font-family="sans-serif" font-size="22" lengthAdjust="spacing" textLength="24.4707" x="517.1743" y="510.9941">no</text><rect fill="#FFCDD2" height="100.375" rx="25" ry="25" style="stroke:#2C5282;stroke-width:1;" width="284.1367" x="22" y="563.5"/><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="224.1328" x="42" y="608.4141">Rechazar asignaci&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="244.1367" x="42" y="638.6016">por conflicto de horario</text><rect fill="#C8E6C9" height="100.375" rx="25" ry="25" style="stroke:#2C5282;stroke-width:1;" width="358.8438" x="377.4727" y="563.5"/><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="226.7695" x="397.4727" y="608.4141">Confirmar asignaci&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="318.8438" x="397.4727" y="638.6016">y persistir en la base de datos</text><rect fill="#F5F9FF" height="100.375" rx="25" ry="25" style="stroke:#2C5282;stroke-width:1;" width="421.5156" x="346.1367" y="703.875"/><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="250.8516" x="366.1367" y="748.7891">Turno queda disponible</text><text fill="#000000" font-family="sans-serif" font-size="24" lengthAdjust="spacing" textLength="381.5156" x="366.1367" y="778.9766">para validaci&#243;n al marcar asistencia</text><polygon fill="#F5F9FF" points="3