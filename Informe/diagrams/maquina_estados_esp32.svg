<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="675px" preserveAspectRatio="none" style="width:893px;height:675px;background:#FFFFFF;" version="1.1" viewBox="0 0 893 675" width="893px" zoomAndPan="magnify"><title>M&#225;quina de estados &#8212; Registro biom&#233;trico en ESP32</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="355.9678" x="261.5161" y="24.5332">M&#225;quina de estados &#8212; Registro biom&#233;trico en ESP32</text><ellipse cx="877" cy="106.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="IDLE"><rect fill="#E8F1FA" height="82.8906" rx="12.5" ry="12.5" style="stroke:#2C5282;stroke-width:0.5;" width="308.7441" x="319.5" y="262.6094"/><line style="stroke:#2C5282;stroke-width:0.5;" x1="319.5" x2="628.2441" y1="290.2188" y2="290.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="31.8896" x="457.9272" y="282.1426">IDLE</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="114.0352" x="324.5" y="307.6758">Espera comando de</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="134.7129" x="324.5" y="322.7695">enrolamiento o marcaje</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="288.7441" x="324.5" y="337.8633">(requiere isCloudReady() para operaciones de red)</text></g><g id="ESPERANDO_HUELLA_REGISTRO"><rect fill="#E8F1FA" height="67.7969" rx="12.5" ry="12.5" style="stroke:#2C5282;stroke-width:0.5;" width="254.1445" x="347" y="439.6094"/><line style="stroke:#2C5282;stroke-width:0.5;" x1="347" x2="601.1445" y1="467.2188" y2="467.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="234.1445" x="357" y="459.1426">ESPERANDO_HUELLA_REGISTRO</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="103.3652" x="352" y="484.6758">Captura huella 1/2</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="170.4316" x="352" y="499.7695">(AS608 &#8212; UART2, GPIO14/15)</text></g><g id="REGISTRO_SEGUNDA_HUELLA"><rect fill="#E8F1FA" height="67.7969" rx="12.5" ry="12.5" style="stroke:#2C5282;stroke-width:0.5;" width="235.4688" x="356.5" y="601.6094"/><line style="stroke:#2C5282;stroke-width:0.5;" x1="356.5" x2="591.9688" y1="629.2188" y2="629.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="215.4688" x="366.5" y="621.1426">REGISTRO_SEGUNDA_HUELLA</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="103.3652" x="361.5" y="646.6758">Captura huella 2/2</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="110.0449" x="361.5" y="661.7695">valida coincidencia</text></g><g id="REGISTRO_FACIAL"><rect fill="#E8F1FA" height="67.7969" rx="12.5" ry="12.5" style="stroke:#2C5282;stroke-width:0.5;" width="198.0957" x="7" y="72.6094"/><line style="stroke:#2C5282;stroke-width:0.5;" x1="7" x2="205.0957" y1="100.2188" y2="100.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="132.2275" x="39.9341" y="92.1426">REGISTRO_FACIAL</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="178.0957" x="12" y="117.6758">Espera click en "Capturar foto"</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="102.3574" x="12" y="132.7695">fotosTomadas = 0</text></g><g id="elem_GMN2"><path d="M548.5,44.6094 L548.5,102.6094 L205.23,106.6094 L548.5,110.6094 L548.5,169.0703 A0,0 0 0 0 548.5,169.0703 L831.7852,169.0703 A0,0 0 0 0 831.7852,169.0703 L831.7852,54.6094 L821.7852,44.6094 L548.5,44.6094 A0,0 0 0 0 548.5,44.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M821.7852,44.6094 L821.7852,54.6094 L831.7852,54.6094 L821.7852,44.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.8843" x="554.5" y="63.1045">Requiere 3 fotos de referencia</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.1743" x="554.5" y="79.4561">(idealmente frontal + 2 perfiles).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.2114" x="554.5" y="95.8076">Cada foto se sube en el momento mediante</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.1606" x="554.5" y="112.1592">una petici&#243;n HTTP POST al backend</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.2852" x="554.5" y="128.5107">(/api/facial/registrar o /api/facial/agregar-foto),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.5869" x="554.5" y="144.8623">que responde de inmediato si la foto</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.0806" x="554.5" y="161.2139">fue aceptada o si hay que repetirla.</text></g><!--link *start* to IDLE--><g id="link_*start*_IDLE"><path d="M875.03,116.6694 C871.75,129.7394 863.99,153.9394 849,168.6094 C789.66,226.6394 709.3773,258.3499 634.6373,277.2299 " fill="none" id="*start*-to-IDLE" style="stroke:#181818;stroke-width:1;"/><polygon fill="#